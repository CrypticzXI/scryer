name: gha-sccache-probe

on:
  push:
    tags:
      - "gha-sccache-v*"

concurrency:
  group: gha-sccache-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-xtask:
    name: linux-xtask
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_IDLE_TIMEOUT: "0"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.95.0"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Build xtask with sccache
        shell: bash
        run: |
          set -euo pipefail
          cargo build -vv -p xtask --locked 2>&1 | tee xtask-build.log

      - name: Show sccache stats
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee sccache-stats.txt

      - name: Upload probe artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gha-sccache-probe-${{ github.run_id }}
          path: |
            xtask-build.log
            sccache-stats.txt
          if-no-files-found: error
          retention-days: 14
