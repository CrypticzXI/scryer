name: sccache-warm

on:
  push:
    branches:
      - main
    paths:
      - ".cargo/**"
      - ".github/workflows/sccache-warm.yml"
      - ".github/workflows/scryer.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "apps/scryer-web/**"
      - "crates/**"
      - "rust-toolchain.toml"

concurrency:
  group: sccache-warm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web
    if: "${{ !startsWith(github.event.head_commit.message, 'release: bump scryer to ') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: apps/scryer-web/package-lock.json

      - name: Install dependencies
        working-directory: apps/scryer-web
        run: npm ci

      - name: Build web app
        working-directory: apps/scryer-web
        env:
          SCRYER_GRAPHQL_URL: /graphql
          SCRYER_METADATA_GATEWAY_GRAPHQL_URL: https://smg.scryer.media/graphql
        run: npm run build

      - name: Verify static output
        run: test -f apps/scryer-web/dist/index.html

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: sccache-warm-web-out-${{ github.run_id }}
          path: apps/scryer-web/dist
          if-no-files-found: error
          retention-days: 2

  linux-build:
    name: linux-${{ matrix.arch }}-${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: [web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            variant: portable
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            sccache_lane: scryer-linux-x86_64-musl
            sccache_writer_id: scryer-linux-x86_64-portable
            artifact_name: scryer-linux-x86_64-portable
            extra_rustflags: ""
          - arch: x86_64
            variant: haswell
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            sccache_lane: scryer-linux-x86_64-musl
            sccache_writer_id: scryer-linux-x86_64-haswell
            artifact_name: scryer-linux-x86_64-haswell
            extra_rustflags: "-C target-cpu=haswell"
          - arch: arm64
            variant: portable
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            sccache_lane: scryer-linux-arm64-musl
            sccache_writer_id: scryer-linux-arm64-portable
            artifact_name: scryer-linux-arm64-portable
            extra_rustflags: ""
          - arch: arm64
            variant: cortex-a76
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            sccache_lane: scryer-linux-arm64-musl
            sccache_writer_id: scryer-linux-arm64-cortex-a76
            artifact_name: scryer-linux-arm64-cortex-a76
            extra_rustflags: "-C target-cpu=cortex-a76"
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
      SCRYER_CARGO_PROFILE: release
      SCRYER_SCCACHE_BUILD_FLAVOR: release
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.95.0"

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends musl-tools mold nasm

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Resolve sccache lane metadata
        id: linux-sccache-metadata
        shell: bash
        run: |
          set -euo pipefail
          version_line="$(python3 - <<'PY'
          import pathlib
          import re

          cargo_toml = pathlib.Path("crates/scryer/Cargo.toml").read_text()
          match = re.search(r'^version = "(\d+)\.(\d+)\.\d+"$', cargo_toml, re.MULTILINE)
          if not match:
              raise SystemExit("failed to resolve crates/scryer/Cargo.toml version")
          print(f"{match.group(1)}.{match.group(2)}.x")
          PY
          )"
          echo "SCRYER_SCCACHE_VERSION_LINE=${version_line}" >> "$GITHUB_ENV"
          echo "version_line=${version_line}" >> "$GITHUB_OUTPUT"

      - name: Restore sccache directory
        id: linux-sccache-restore
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/sccache
          key: gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-${{ steps.linux-sccache-metadata.outputs.version_line }}-${{ matrix.sccache_writer_id }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/scryer-web/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-${{ steps.linux-sccache-metadata.outputs.version_line }}-${{ matrix.sccache_writer_id }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/scryer-web/package-lock.json') }}-
            gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-${{ steps.linux-sccache-metadata.outputs.version_line }}-${{ matrix.sccache_writer_id }}-
            gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-${{ steps.linux-sccache-metadata.outputs.version_line }}-
            gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-
            gha-sccache-v2-${{ matrix.sccache_lane }}-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Download embedded web artifact
        uses: actions/download-artifact@v8
        with:
          name: sccache-warm-web-out-${{ github.run_id }}
          path: scryer-web-out

      - name: Prime sccache server
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Build scryer with sccache
        shell: bash
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold"
          if [ -n "${{ matrix.extra_rustflags }}" ]; then
            export RUSTFLAGS="${RUSTFLAGS} ${{ matrix.extra_rustflags }}"
          fi
          cargo build -p scryer --profile "${SCRYER_CARGO_PROFILE}" --locked --target "${{ matrix.target }}"

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          else
            echo "sccache not installed; skipping stats"
          fi

      - name: Save sccache directory
        if: always() && steps.linux-sccache-restore.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/sccache
          key: ${{ steps.linux-sccache-restore.outputs.cache-primary-key }}

  macos-build:
    name: macos-${{ matrix.arch }}-${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: [web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            variant: portable
            runner: macos-15
            target: aarch64-apple-darwin
            sccache_lane: scryer-macos-arm64
            sccache_writer_id: scryer-darwin-arm64-portable
            artifact_name: scryer-darwin-arm64-portable
            extra_rustflags: ""
          - arch: arm64
            variant: apple-m1
            runner: macos-15
            target: aarch64-apple-darwin
            sccache_lane: scryer-macos-arm64
            sccache_writer_id: scryer-darwin-arm64-apple-m1
            artifact_name: scryer-darwin-arm64-apple-m1
            extra_rustflags: "-C target-cpu=apple-m1 --cfg aes_armv8 --cfg chacha20_force_neon"
          - arch: x86_64
            variant: portable
            runner: macos-15-intel
            target: x86_64-apple-darwin
            sccache_lane: scryer-macos-x86_64
            sccache_writer_id: scryer-darwin-x86_64-portable
            artifact_name: scryer-darwin-x86_64-portable
            extra_rustflags: ""
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: /Users/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_IDLE_TIMEOUT: "0"
      SCRYER_CARGO_PROFILE: release
      SCRYER_SCCACHE_BUILD_FLAVOR: release
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Resolve sccache lane metadata
        id: macos-sccache-metadata
        shell: bash
        run: |
          set -euo pipefail
          version_line="$(python3 - <<'PY'
          import pathlib
          import re

          cargo_toml = pathlib.Path("crates/scryer/Cargo.toml").read_text()
          match = re.search(r'^version = "(\d+)\.(\d+)\.\d+"$', cargo_toml, re.MULTILINE)
          if not match:
              raise SystemExit("failed to resolve crates/scryer/Cargo.toml version")
          print(f"{match.group(1)}.{match.group(2)}.x")
          PY
          )"
          echo "SCRYER_SCCACHE_VERSION_LINE=${version_line}" >> "$GITHUB_ENV"
          echo "version_line=${version_line}" >> "$GITHUB_OUTPUT"

      - name: Restore sccache directory
        id: macos-sccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-${{ steps.macos-sccache-metadata.outputs.version_line }}-${{ matrix.sccache_writer_id }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/scryer-web/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-${{ steps.macos-sccache-metadata.outputs.version_line }}-${{ matrix.sccache_writer_id }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/scryer-web/package-lock.json') }}-
            gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-${{ steps.macos-sccache-metadata.outputs.version_line }}-${{ matrix.sccache_writer_id }}-
            gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-${{ steps.macos-sccache-metadata.outputs.version_line }}-
            gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-
            gha-sccache-v2-${{ matrix.sccache_lane }}-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Download embedded web artifact
        uses: actions/download-artifact@v8
        with:
          name: sccache-warm-web-out-${{ github.run_id }}
          path: scryer-web-out

      - name: Install system dependencies
        run: brew install nasm

      - name: Prime sccache server
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Build scryer with sccache
        shell: bash
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=."
          if [ -n "${{ matrix.extra_rustflags }}" ]; then
            export RUSTFLAGS="${RUSTFLAGS} ${{ matrix.extra_rustflags }}"
          fi
          cargo build -p scryer --profile "${SCRYER_CARGO_PROFILE}" --locked --target "${{ matrix.target }}"

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          else
            echo "sccache not installed; skipping stats"
          fi

      - name: Save sccache directory
        if: always() && steps.macos-sccache-restore.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.macos-sccache-restore.outputs.cache-primary-key }}

  windows-build:
    name: windows-${{ matrix.arch }}-portable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: [web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            toolchain: 1.95.0-x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            sccache_lane: scryer-windows-x86_64-msvc
            sccache_writer_id: scryer-windows-x86_64-portable
            artifact_name: scryer-windows-x86_64-portable
            install_nasm: true
            use_clang_cl: false
          - arch: arm64
            runner: windows-11-arm
            toolchain: 1.95.0-aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            sccache_lane: scryer-windows-arm64-msvc
            sccache_writer_id: scryer-windows-arm64-portable
            artifact_name: scryer-windows-arm64-portable
            install_nasm: false
            use_clang_cl: true
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_IDLE_TIMEOUT: "0"
      SCRYER_CARGO_PROFILE: release
      SCRYER_SCCACHE_BUILD_FLAVOR: release
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Resolve sccache lane metadata
        id: windows-sccache-metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cargoToml = Get-Content crates/scryer/Cargo.toml -Raw
          $match = [regex]::Match($cargoToml, '(?m)^version = "(?<major>\d+)\.(?<minor>\d+)\.\d+"\r?$')
          if (-not $match.Success) {
            throw "failed to resolve crates/scryer/Cargo.toml version"
          }
          $versionLine = "$($match.Groups['major'].Value).$($match.Groups['minor'].Value).x"
          "SCRYER_SCCACHE_VERSION_LINE=$versionLine" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version_line=$versionLine" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore sccache directory
        id: windows-sccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\.sccache
          key: gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-${{ steps.windows-sccache-metadata.outputs.version_line }}-${{ matrix.sccache_writer_id }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/scryer-web/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-${{ steps.windows-sccache-metadata.outputs.version_line }}-${{ matrix.sccache_writer_id }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/scryer-web/package-lock.json') }}-
            gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-${{ steps.windows-sccache-metadata.outputs.version_line }}-${{ matrix.sccache_writer_id }}-
            gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-${{ steps.windows-sccache-metadata.outputs.version_line }}-
            gha-sccache-v2-${{ matrix.sccache_lane }}-${{ env.SCRYER_SCCACHE_BUILD_FLAVOR }}-
            gha-sccache-v2-${{ matrix.sccache_lane }}-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Download embedded web artifact
        uses: actions/download-artifact@v8
        with:
          name: sccache-warm-web-out-${{ github.run_id }}
          path: scryer-web-out

      - name: Install NASM
        if: ${{ matrix.install_nasm }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip"
          $expectedSha256 = "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4"
          Invoke-WebRequest $url -OutFile nasm.zip
          $actualSha256 = (Get-FileHash nasm.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "NASM checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive nasm.zip -DestinationPath C:\nasm
          $dir = (Get-ChildItem C:\nasm -Directory | Select-Object -First 1).FullName
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Exclude build dir from Windows Defender
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Prime sccache server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          sccache --start-server
          sccache --zero-stats

      - name: Build scryer with sccache
        shell: pwsh
        env:
          USE_CLANG_CL: ${{ matrix.use_clang_cl }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:SCRYER_EMBED_UI_DIR = Join-Path $env:GITHUB_WORKSPACE 'scryer-web-out'
          $env:SCRYER_SMG_REGISTRATION_SECRET = "${{ secrets.SMG_REGISTRATION_SECRET }}"
          $env:SCRYER_SMG_GRAPHQL_URL = "https://smg.scryer.media/graphql"
          $env:RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=."
          if ($env:USE_CLANG_CL -eq "true") {
            $env:CC = "clang-cl"
          }
          cargo build -p scryer --profile $env:SCRYER_CARGO_PROFILE --locked --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats
          } else {
            Write-Host "sccache not installed; skipping stats"
          }

      - name: Save sccache directory
        if: always() && steps.windows-sccache-restore.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ steps.windows-sccache-restore.outputs.cache-primary-key }}
