name: gha-sccache-probe-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "gha-sccache-win-v*"

concurrency:
  group: gha-sccache-probe-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-xtask:
    name: windows-xtask
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.95.0-x86_64-pc-windows-msvc"

      - name: Restore sccache directory
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.sccache
          key: gha-sccache-windows-xtask-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'xtask/Cargo.toml', 'xtask-support/Cargo.toml') }}
          restore-keys: |
            gha-sccache-windows-xtask-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Prime sccache server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          sccache --start-server
          sccache --zero-stats

      - name: Build xtask with sccache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build -vv -p xtask --locked 2>&1 | Tee-Object -FilePath xtask-build.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Show sccache stats
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          sccache --show-stats | Tee-Object -FilePath sccache-stats.txt

      - name: Upload probe artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gha-sccache-probe-windows-${{ github.run_id }}
          path: |
            xtask-build.log
            sccache-stats.txt
          if-no-files-found: error
          retention-days: 14
