name: gha-sccache-probe-macos

on:
  workflow_dispatch:
  push:
    tags:
      - "gha-sccache-mac-v*"

concurrency:
  group: gha-sccache-probe-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-xtask:
    name: macos-xtask
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.95.0"

      - name: Restore sccache directory
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-macos-xtask-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'xtask/Cargo.toml', 'xtask-support/Cargo.toml') }}
          restore-keys: |
            gha-sccache-macos-xtask-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Prime sccache server
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Build xtask with sccache
        shell: bash
        run: |
          set -euo pipefail
          cargo build -vv -p xtask --locked 2>&1 | tee xtask-build.log

      - name: Show sccache stats
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee sccache-stats.txt

      - name: Upload probe artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gha-sccache-probe-macos-${{ github.run_id }}
          path: |
            xtask-build.log
            sccache-stats.txt
          if-no-files-found: error
          retention-days: 14
