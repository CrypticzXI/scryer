name: scryer

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "scryer-v*"

concurrency:
  group: scryer-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: apps/scryer-web/package-lock.json

      - name: Install dependencies
        working-directory: apps/scryer-web
        run: npm ci

      - name: Lint
        working-directory: apps/scryer-web
        run: npm run lint

      - name: Build web app
        working-directory: apps/scryer-web
        env:
          SCRYER_GRAPHQL_URL: /graphql
          SCRYER_METADATA_GATEWAY_GRAPHQL_URL: https://smg.scryer.media/graphql
        run: npm run build

      - name: Verify static output
        run: test -f apps/scryer-web/dist/index.html

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: apps/scryer-web/dist
          if-no-files-found: error
          retention-days: 14

  rust-check:
    name: rust-check
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    needs: [web]
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends musl-tools mold nasm

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Restore cargo dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gha-rust-cache-linux-rust-check
          cache-targets: "false"
          cache-workspace-crates: "false"
          key: rust-check

      - name: Restore sccache directory
        id: rust-check-sccache-restore
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/sccache
          key: gha-sccache-linux-rust-check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/scryer-web/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-linux-rust-check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/scryer-web/package-lock.json') }}-
            gha-sccache-linux-rust-check-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Download embedded web artifact
        uses: actions/download-artifact@v8
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out

      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Run clippy for production binary packages
        shell: bash
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold"
          cargo clippy --target x86_64-unknown-linux-musl --locked \
            -p scryer \
            -p scryer-application \
            -p scryer-domain \
            -p scryer-infrastructure \
            -p scryer-interface \
            -p scryer-mediainfo \
            -p scryer-plugins \
            -p scryer-release-parser \
            -p scryer-rules \
            -- -D warnings 2>&1 | tee rust-check-clippy.log

      - name: Run production binary package tests
        shell: bash
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold"
          export RUST_MIN_STACK="4194304"
          cargo nextest run --target x86_64-unknown-linux-musl --locked \
            -p scryer \
            -p scryer-application \
            -p scryer-domain \
            -p scryer-infrastructure \
            -p scryer-interface \
            -p scryer-mediainfo \
            -p scryer-plugins \
            -p scryer-release-parser \
            -p scryer-rules 2>&1 | tee rust-check-nextest.log

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee rust-check-sccache-stats.txt

      - name: Upload rust-check artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-check-${{ github.run_id }}
          path: |
            rust-check-clippy.log
            rust-check-nextest.log
            rust-check-sccache-stats.txt
          if-no-files-found: error
          retention-days: 14

      - name: Save sccache directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/sccache
          key: ${{ steps.rust-check-sccache-restore.outputs.cache-primary-key }}

  launcher-build:
    name: launcher-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            cache_lane: launcher-amd64
            artifact_name: launcher-linux-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cache_lane: launcher-arm64
            artifact_name: launcher-linux-arm64
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.95.0"

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends musl-tools mold

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Restore cargo dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gha-rust-cache-${{ matrix.cache_lane }}
          cache-targets: "false"
          cache-workspace-crates: "false"
          key: ${{ matrix.artifact_name }}

      - name: Restore sccache directory
        id: launcher-sccache-restore
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/sccache
          key: gha-sccache-${{ matrix.artifact_name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-${{ matrix.artifact_name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            gha-sccache-${{ matrix.artifact_name }}-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Prime sccache server
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Run launcher tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p scryer-launcher --locked 2>&1 | tee "${{ matrix.artifact_name }}-test.log"

      - name: Build launcher
        shell: bash
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold"
          cargo build -p scryer-launcher --release --locked --target "${{ matrix.target }}" 2>&1 | tee "${{ matrix.artifact_name }}-build.log"

      - name: Package launcher tarball
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz -C target/${{ matrix.target }}/release scryer-launcher

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee "${{ matrix.artifact_name }}-sccache-stats.txt"

      - name: Upload launcher artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}-test.log
            ${{ matrix.artifact_name }}-build.log
            ${{ matrix.artifact_name }}-sccache-stats.txt
          if-no-files-found: error
          retention-days: 14

      - name: Save sccache directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/sccache
          key: ${{ steps.launcher-sccache-restore.outputs.cache-primary-key }}

  linux-build:
    name: linux-${{ matrix.arch }}-${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: [web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            variant: portable
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            cache_lane: linux-x86_64
            artifact_name: scryer-linux-x86_64-portable
            extra_rustflags: ""
          - arch: x86_64
            variant: haswell
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            cache_lane: linux-x86_64
            artifact_name: scryer-linux-x86_64-haswell
            extra_rustflags: "-C target-cpu=haswell"
          - arch: arm64
            variant: portable
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cache_lane: linux-arm64
            artifact_name: scryer-linux-arm64-portable
            extra_rustflags: ""
          - arch: arm64
            variant: cortex-a76
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cache_lane: linux-arm64
            artifact_name: scryer-linux-arm64-cortex-a76
            extra_rustflags: "-C target-cpu=cortex-a76"
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.95.0"

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends musl-tools mold nasm

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Restore cargo dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gha-rust-cache-${{ matrix.cache_lane }}
          cache-targets: "false"
          cache-workspace-crates: "false"
          key: ${{ matrix.artifact_name }}

      - name: Restore sccache directory
        id: linux-sccache-restore
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/sccache
          key: gha-sccache-${{ matrix.artifact_name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/scryer-web/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-${{ matrix.artifact_name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/scryer-web/package-lock.json') }}-
            gha-sccache-${{ matrix.artifact_name }}-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Download embedded web artifact
        uses: actions/download-artifact@v8
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out

      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Build scryer with sccache
        shell: bash
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold"
          if [ -n "${{ matrix.extra_rustflags }}" ]; then
            export RUSTFLAGS="${RUSTFLAGS} ${{ matrix.extra_rustflags }}"
          fi
          cargo build -p scryer --release --locked --target "${{ matrix.target }}" 2>&1 | tee "${{ matrix.artifact_name }}-build.log"

      - name: Package tarball
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz -C target/${{ matrix.target }}/release scryer

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee "${{ matrix.artifact_name }}-sccache-stats.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}-build.log
            ${{ matrix.artifact_name }}-sccache-stats.txt
          if-no-files-found: error
          retention-days: 14

      - name: Save sccache directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/sccache
          key: ${{ steps.linux-sccache-restore.outputs.cache-primary-key }}

  macos-build:
    name: macos-${{ matrix.arch }}-${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: [web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            variant: portable
            runner: macos-15
            target: aarch64-apple-darwin
            cache_lane: macos-arm64
            artifact_name: scryer-darwin-arm64-portable
            extra_rustflags: ""
          - arch: arm64
            variant: apple-m1
            runner: macos-15
            target: aarch64-apple-darwin
            cache_lane: macos-arm64
            artifact_name: scryer-darwin-arm64-apple-m1
            extra_rustflags: "-C target-cpu=apple-m1 --cfg aes_armv8 --cfg chacha20_force_neon"
          - arch: x86_64
            variant: portable
            runner: macos-15-intel
            target: x86_64-apple-darwin
            cache_lane: macos-x86_64
            artifact_name: scryer-darwin-x86_64-portable
            extra_rustflags: ""
          - arch: x86_64
            variant: haswell
            runner: macos-15-intel
            target: x86_64-apple-darwin
            cache_lane: macos-x86_64
            artifact_name: scryer-darwin-x86_64-haswell
            extra_rustflags: "-C target-cpu=haswell"
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: /Users/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Restore cargo dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gha-rust-cache-${{ matrix.cache_lane }}
          cache-targets: "false"
          cache-workspace-crates: "false"
          key: ${{ matrix.artifact_name }}

      - name: Restore sccache directory
        id: macos-sccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-${{ matrix.artifact_name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/scryer-web/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-${{ matrix.artifact_name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/scryer-web/package-lock.json') }}-
            gha-sccache-${{ matrix.artifact_name }}-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Download embedded web artifact
        uses: actions/download-artifact@v8
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out

      - name: Install system dependencies
        run: brew install nasm

      - name: Prime sccache server
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Build scryer with sccache
        shell: bash
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=."
          if [ -n "${{ matrix.extra_rustflags }}" ]; then
            export RUSTFLAGS="${RUSTFLAGS} ${{ matrix.extra_rustflags }}"
          fi
          cargo build -p scryer --release --locked --target "${{ matrix.target }}" 2>&1 | tee "${{ matrix.artifact_name }}-build.log"

      - name: Codesign binary
        if: ${{ secrets.APPLE_SIGNING_CERT_P12 != '' && secrets.APPLE_SIGNING_CERT_PASSWORD != '' }}
        env:
          CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain-db"
          KEYCHAIN_PASS="ci-ephemeral"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo -n "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          codesign --sign "Scryer Media Signing" --identifier media.scryer.app --force "target/${{ matrix.target }}/release/scryer"
          codesign --verify --verbose "target/${{ matrix.target }}/release/scryer"
          rm /tmp/cert.p12
          security delete-keychain "$KEYCHAIN"

      - name: Package tarball
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz -C target/${{ matrix.target }}/release scryer

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee "${{ matrix.artifact_name }}-sccache-stats.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}-build.log
            ${{ matrix.artifact_name }}-sccache-stats.txt
          if-no-files-found: error
          retention-days: 14

      - name: Save sccache directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.macos-sccache-restore.outputs.cache-primary-key }}

  windows-build:
    name: windows-${{ matrix.arch }}-portable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: [web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            toolchain: 1.95.0-x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            cache_lane: windows-x64
            artifact_name: scryer-windows-x86_64-portable
            install_nasm: true
            use_clang_cl: false
          - arch: arm64
            runner: windows-11-arm
            toolchain: 1.95.0-aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            cache_lane: windows-arm64
            artifact_name: scryer-windows-arm64-portable
            install_nasm: false
            use_clang_cl: true
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Restore cargo dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gha-rust-cache-${{ matrix.cache_lane }}
          cache-targets: "false"
          cache-workspace-crates: "false"
          key: ${{ matrix.artifact_name }}

      - name: Restore sccache directory
        id: windows-sccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\.sccache
          key: gha-sccache-${{ matrix.artifact_name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/scryer-web/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-${{ matrix.artifact_name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/scryer-web/package-lock.json') }}-
            gha-sccache-${{ matrix.artifact_name }}-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Download embedded web artifact
        uses: actions/download-artifact@v8
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out

      - name: Install NASM
        if: ${{ matrix.install_nasm }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip"
          $expectedSha256 = "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4"
          Invoke-WebRequest $url -OutFile nasm.zip
          $actualSha256 = (Get-FileHash nasm.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "NASM checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive nasm.zip -DestinationPath C:\nasm
          $dir = (Get-ChildItem C:\nasm -Directory | Select-Object -First 1).FullName
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Exclude build dir from Windows Defender
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Prime sccache server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          sccache --start-server
          sccache --zero-stats

      - name: Build scryer with sccache
        shell: pwsh
        env:
          USE_CLANG_CL: ${{ matrix.use_clang_cl }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:SCRYER_EMBED_UI_DIR = Join-Path $env:GITHUB_WORKSPACE 'scryer-web-out'
          $env:SCRYER_SMG_REGISTRATION_SECRET = "${{ secrets.SMG_REGISTRATION_SECRET }}"
          $env:SCRYER_SMG_GRAPHQL_URL = "https://smg.scryer.media/graphql"
          $env:RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=."
          if ($env:USE_CLANG_CL -eq "true") {
            $env:CC = "clang-cl"
          }
          cargo build -p scryer --release --locked --target ${{ matrix.target }} 2>&1 | Tee-Object -FilePath "${{ matrix.artifact_name }}-build.log"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Create README.txt
        shell: pwsh
        run: |
          @"
          scryer for Windows
          ==================

          Quick Start
          -----------
          1. Double-click scryer.exe (or run it from a terminal).
          2. Open http://localhost:8080 in your browser.

          Data is stored in %LOCALAPPDATA%\scryer by default. To use a
          different location, pass --data-dir:

              scryer.exe --data-dir C:\scryer-data

          Encryption Key
          --------------
          Scryer encrypts passwords and API keys stored in its database.
          On first run an encryption key is auto-generated and stored
          securely by Windows. No manual key management is needed.

          To override the key (advanced), set the environment variable
          SCRYER_ENCRYPTION_KEY before starting scryer.

          Running as a Windows Service (NSSM)
          ------------------------------------
          NSSM (https://nssm.cc) lets you run scryer as a background
          service that starts automatically with Windows.

          1. Download nssm and extract it somewhere on your PATH.
          2. Open an elevated (Administrator) terminal and run:

              nssm install scryer "C:\path\to\scryer.exe"
              nssm set scryer AppDirectory "C:\path\to"
              nssm set scryer AppParameters "--data-dir C:\scryer-data"
              nssm set scryer Start SERVICE_AUTO_START
              nssm start scryer

          To remove the service later:

              nssm stop scryer
              nssm remove scryer confirm

          Environment Variables
          ---------------------
          SCRYER_MOVIES_PATH      Movies directory
          SCRYER_SERIES_PATH      Series directory
          SCRYER_BIND             Listen address (default: 127.0.0.1:8080)
          SCRYER_OPEN_BROWSER     Set to "false" to disable auto-open
          SCRYER_DB_PATH          Override database path (advanced)
          "@ | Set-Content -Path README.txt -Encoding UTF8

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path "target\${{ matrix.target }}\release\scryer.exe",README.txt -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          sccache --show-stats | Tee-Object -FilePath "${{ matrix.artifact_name }}-sccache-stats.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}-build.log
            ${{ matrix.artifact_name }}-sccache-stats.txt
          if-no-files-found: error
          retention-days: 14

      - name: Save sccache directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ steps.windows-sccache-restore.outputs.cache-primary-key }}

  docker-export:
    name: docker-export-${{ matrix.platform_id }}
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    needs: [rust-check, launcher-build, linux-build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: amd64
            runs_on: ubuntu-24.04
            platform: linux/amd64
            tar_name: scryer-linux-amd64-image.tar
            local_tag: scryer:test-amd64
          - platform_id: arm64
            runs_on: ubuntu-24.04-arm
            platform: linux/arm64
            tar_name: scryer-linux-arm64-image.tar
            local_tag: scryer:test-arm64
    steps:
      - uses: actions/checkout@v6

      - name: Download linux amd64 portable artifact
        uses: actions/download-artifact@v8
        with:
          name: scryer-linux-x86_64-portable-${{ github.run_id }}
          path: artifacts

      - name: Download linux amd64 haswell artifact
        uses: actions/download-artifact@v8
        with:
          name: scryer-linux-x86_64-haswell-${{ github.run_id }}
          path: artifacts

      - name: Download linux arm64 portable artifact
        uses: actions/download-artifact@v8
        with:
          name: scryer-linux-arm64-portable-${{ github.run_id }}
          path: artifacts

      - name: Download linux arm64 cortex-a76 artifact
        uses: actions/download-artifact@v8
        with:
          name: scryer-linux-arm64-cortex-a76-${{ github.run_id }}
          path: artifacts

      - name: Download launcher amd64 artifact
        uses: actions/download-artifact@v8
        with:
          name: launcher-linux-amd64-${{ github.run_id }}
          path: artifacts

      - name: Download launcher arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: launcher-linux-arm64-${{ github.run_id }}
          path: artifacts

      - name: Validate Docker docs contract
        if: matrix.platform_id == 'amd64'
        run: sh docker/test_docs_contract.sh

      - name: Prepare build context
        run: sh docker/prepare-build-context.sh artifacts docker-ctx

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build downloadable image tarball
        uses: docker/build-push-action@v7
        with:
          context: docker-ctx
          file: docker/scryer.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=docker,dest=/tmp/${{ matrix.tar_name }}
          tags: ${{ matrix.local_tag }}

      - name: Load built image
        run: docker load -i /tmp/${{ matrix.tar_name }}

      - name: Smoke test image runtime
        run: sh docker/test_image_runtime.sh ${{ matrix.local_tag }} ${{ matrix.platform }}

      - name: Upload image tarball
        uses: actions/upload-artifact@v7
        with:
          name: scryer-image-linux-${{ matrix.platform_id }}-${{ github.run_id }}
          path: /tmp/${{ matrix.tar_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Add local test instructions
        run: |
          {
            echo "### Downloadable Docker image (${{ matrix.platform }})"
            echo
            echo "- Artifact: \`scryer-image-linux-${{ matrix.platform_id }}-${{ github.run_id }}\`"
            echo "- Tarball: \`${{ matrix.tar_name }}\`"
            echo "- Load: \`docker load -i ${{ matrix.tar_name }}\`"
            echo "- Run: \`docker run --rm -p 8080:8080 -v /path/to/scryer/config:/config ${{ matrix.local_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-publish:
    name: docker-publish
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [rust-check, launcher-build, linux-build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Download linux amd64 portable artifact
        uses: actions/download-artifact@v8
        with:
          name: scryer-linux-x86_64-portable-${{ github.run_id }}
          path: artifacts

      - name: Download linux amd64 haswell artifact
        uses: actions/download-artifact@v8
        with:
          name: scryer-linux-x86_64-haswell-${{ github.run_id }}
          path: artifacts

      - name: Download linux arm64 portable artifact
        uses: actions/download-artifact@v8
        with:
          name: scryer-linux-arm64-portable-${{ github.run_id }}
          path: artifacts

      - name: Download linux arm64 cortex-a76 artifact
        uses: actions/download-artifact@v8
        with:
          name: scryer-linux-arm64-cortex-a76-${{ github.run_id }}
          path: artifacts

      - name: Download launcher amd64 artifact
        uses: actions/download-artifact@v8
        with:
          name: launcher-linux-amd64-${{ github.run_id }}
          path: artifacts

      - name: Download launcher arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: launcher-linux-arm64-${{ github.run_id }}
          path: artifacts

      - name: Validate Docker docs contract
        run: sh docker/test_docs_contract.sh

      - name: Prepare build context
        run: sh docker/prepare-build-context.sh artifacts docker-ctx

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/scryer
          tags: |
            type=raw,value=latest
            type=sha
            type=match,pattern=scryer-v(.*),group=1

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker-ctx
          file: docker/scryer.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [rust-check, linux-build, macos-build, windows-build, docker-publish]
    permissions:
      contents: write
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'scryer-v') }}
    steps:
      - name: Resolve release tag
        id: release_meta
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          echo "tag_name=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: scryer-*-${{ github.run_id }}
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-artifacts
        run: shasum -a 256 scryer-*.tar.gz scryer-*.zip > scryer-checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.tag_name }}
          files: |
            release-artifacts/scryer-*.tar.gz
            release-artifacts/scryer-*.zip
            release-artifacts/scryer-checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_PUSH_TOKEN not set; skipping tap update."
            exit 0
          fi
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#scryer-v}"
          LINUX_X86_SHA=$(shasum -a 256 release-artifacts/scryer-linux-x86_64-portable.tar.gz | cut -d ' ' -f1)
          LINUX_ARM_SHA=$(shasum -a 256 release-artifacts/scryer-linux-arm64-portable.tar.gz | cut -d ' ' -f1)
          DARWIN_ARM_SHA=$(shasum -a 256 release-artifacts/scryer-darwin-arm64-apple-m1.tar.gz | cut -d ' ' -f1)
          DARWIN_X86_SHA=$(shasum -a 256 release-artifacts/scryer-darwin-x86_64-haswell.tar.gz | cut -d ' ' -f1)
          REPO="${{ github.repository }}"

          mkdir -p tap/Formula
          cat > tap/Formula/scryer.rb << FORMULA
          class Scryer < Formula
            desc "Self-hosted media acquisition and management platform"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"
            license "MIT"

            def install_support_files
              (pkgshare/"config.env.example").write <<~EOS
                # Homebrew-managed Scryer service overrides.
                SCRYER_BIND=127.0.0.1:8686
              EOS

              (libexec/"scryer-service").write <<~SH
                #!/bin/sh
                CONFIG_FILE="#{etc}/scryer/config.env"

                if [ -f "\$CONFIG_FILE" ]; then
                  set -a
                  . "\$CONFIG_FILE"
                  set +a
                fi

                exec "#{opt_bin}/scryer" --data-dir "#{var}/scryer" "\$@"
              SH

              chmod 0755, libexec/"scryer-service"
            end

            on_macos do
              on_arm do
                url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-darwin-arm64-apple-m1.tar.gz"
                sha256 "${DARWIN_ARM_SHA}"
              end

              on_intel do
                url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-darwin-x86_64-haswell.tar.gz"
                sha256 "${DARWIN_X86_SHA}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-linux-arm64-portable.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              end

              on_intel do
                url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-linux-x86_64-portable.tar.gz"
                sha256 "${LINUX_X86_SHA}"
              end
            end

            def install
              bin.install "scryer"
              install_support_files

              config_dir = etc/"scryer"
              config_dir.mkpath
              (var/"scryer").mkpath
              (var/"log").mkpath
              config_file = config_dir/"config.env"
              unless config_file.exist?
                config_file.write <<~EOS
                  SCRYER_BIND=127.0.0.1:8686
                EOS
              end
            end

            def caveats
              <<~EOS
                Edit #{etc}/scryer/config.env to customize the Homebrew-managed service,
                then restart it with:
                  brew services restart scryer
              EOS
            end

            service do
              run [opt_libexec/"scryer-service"]
              keep_alive true
              log_path var/"log/scryer.log"
              error_log_path var/"log/scryer.log"
            end

            test do
              assert_match "scryer", shell_output("#{bin}/scryer --version")
            end
          end
          FORMULA

          sed -i 's/^          //' tap/Formula/scryer.rb

          git clone "https://${TAP_TOKEN}@github.com/scryer-media/homebrew-scryer.git" tap-repo
          mkdir -p tap-repo/Formula
          cp tap/Formula/scryer.rb tap-repo/Formula/scryer.rb
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/scryer.rb
          if git diff --cached --quiet; then
            echo "Homebrew tap already up to date."
          else
            git commit -m "scryer ${VERSION}"
            git push origin HEAD:main
          fi

      - name: Trigger marketing site rebuild
        continue-on-error: true
        env:
          WEB_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$WEB_TOKEN" ]; then
            echo "WEB_DISPATCH_TOKEN not set; skipping site rebuild."
            exit 0
          fi
          git clone "https://${WEB_TOKEN}@github.com/scryer-media/web.git" web-repo
          cd web-repo
          git config user.name "github-actions[bot]"
          git config user.email "133935777+NZBMan@users.noreply.github.com"
          git commit --allow-empty -m "rebuild: ${{ github.ref_name }}"
          git push origin HEAD:main
