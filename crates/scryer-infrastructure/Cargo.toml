[package]
name = "scryer-infrastructure"
version = "0.15.9"
edition.workspace = true

[features]
default = ["image-processing"]
image-processing = ["dep:fast_image_resize", "dep:image", "dep:kamadak-exif", "dep:ravif"]

[dependencies]
scryer-domain = { path = "../scryer-domain" }
scryer-application = { path = "../scryer-application" }
scryer-outbound-http = { path = "../scryer-outbound-http" }
scryer-rules = { path = "../scryer-rules" }
async-trait = { workspace = true }
base64 = "0.22"
serde_json = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
quick-xml = { workspace = true }
blake3 = "1"
sha2 = "0.10"
libsqlite3-sys = { version = "0.37.0", default-features = false, features = ["bundled"] }
unicode-normalization = "0.1"
zstd = "0.13"
flate2 = "1"
async-compression = { version = "0.4", features = ["tokio", "zstd", "gzip"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls-no-provider", "http2", "gzip", "brotli", "zstd", "deflate", "stream"] }
ml-dsa = "=0.1.0"
aws-lc-rs = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
metrics = { workspace = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt", "io"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["avif", "jpeg", "png", "webp"], optional = true }
fast_image_resize = { version = "6", optional = true }
kamadak-exif = { version = "0.6", optional = true }
filetime = "0.2"

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
ravif = { version = "0.13", default-features = false, features = ["threading"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }
security-framework-sys = { workspace = true }
# security-framework-sys is v2 (re-exported by security-framework v3)

[target.'cfg(not(all(target_os = "windows", target_arch = "aarch64")))'.dependencies]
ravif = { version = "0.13", features = ["threading"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring-core = { workspace = true }
windows-native-keyring-store = { workspace = true }

[dev-dependencies]
scryer-plugin-sdk = { path = "../scryer-plugin-sdk" }
tempfile = "3"
wiremock = { workspace = true }

[build-dependencies]
blake3 = "1"
cc = "1.1"
graphql-parser = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
toml = { workspace = true }
zstd = "0.13"
