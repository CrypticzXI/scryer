fragment MovieFields on TvdbMovie {
  tvdb_id
  name
  slug
  year
  status
  overview
  poster_url
  language
  runtime_minutes
  sort_title
  imdb_id
  tmdb_id
  anidb_id
  genres
  studio
  tmdb_release_date
  rating
  rating_sources
  external_ratings {
    source
    value
    score
    normalized
    votes
    url
  }
  artworks {
    kind
    url
  }
}
