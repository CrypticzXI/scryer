[package]
name = "scryer-plugins"
version = "0.13.1"
edition.workspace = true

[dependencies]
scryer-application = { path = "../scryer-application" }
scryer-domain = { path = "../scryer-domain" }
scryer-plugin-sdk = { path = "../scryer-plugin-sdk" }
scryer-rules = { path = "../scryer-rules" }
extism = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Enable brotli decompression for extism's ureq HTTP client (gzip is already default)
ureq = { version = "3", default-features = false, features = ["gzip", "brotli"] }
base64 = "0.22"
rustls = "0.23"
rustls-native-certs = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
