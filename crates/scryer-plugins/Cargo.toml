[package]
name = "scryer-plugins"
version = "0.16.8"
edition.workspace = true

[dependencies]
scryer-application = { path = "../scryer-application" }
scryer-domain = { path = "../scryer-domain" }
scryer-outbound-http = { path = "../scryer-outbound-http" }
scryer-plugin-sdk = { path = "../scryer-plugin-sdk" }
scryer-rules = { path = "../scryer-rules" }
extism = { workspace = true }
extism-manifest = { version = "1.21", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
aws-lc-sys = "0.42"
crc32fast = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "http2"] }
base64 = "0.22"
glob = "0.3"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
url = "2"
zstd = { version = "0.13", default-features = false }
tempfile = "3"
libc = "0.2"
# RFC 123 WP1: native wasmtime archive host (crypto ABI + command protocol).
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
# RFC 123 WP2.5: host-thread PAR2 damaged-member reconstruct. The Weaver
# GF(2^16) field + SIMD mul-acc kernel, so the host repair is byte-identical to
# Weaver's own repair path.
# `default-features = false` keeps the optional Metal/objc2 GPU backend
# (weaver-reed-solomon's non-default `metal` feature) out of scryer's graph:
# the host reconstruct uses only the CPU/SIMD kernels, never the Metal session.
weaver-reed-solomon = { version = "0.2.0", default-features = false }

[dev-dependencies]
# WAT guests are authored inline: `wasmtime::Module::new` compiles text directly
# (wasmtime's default `wat` feature), and `wat::parse_str` yields raw wasm bytes
# for tests that feed the descriptor-shape classifier.
wat = "1"
