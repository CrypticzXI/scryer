[package]
name = "scryer-application"
version = "0.14.2"
edition.workspace = true

[dependencies]
scryer-domain = { path = "../scryer-domain" }
scryer-plugin-sdk = { path = "../scryer-plugin-sdk" }
scryer-release-parser = { path = "../scryer-release-parser" }
scryer-rules = { path = "../scryer-rules" }
scryer-mediainfo = { path = "../scryer-mediainfo" }
scryer-outbound-http = { path = "../scryer-outbound-http" }
jsonwebtoken = { workspace = true }
rand_core = { workspace = true }
argon2 = { workspace = true }
ring = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "http2", "gzip", "brotli", "zstd", "deflate"] }
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }
metrics = { workspace = true }
weaver-rar = { git = "https://github.com/scryer-media/weaver.git", tag = "weaver-v0.3.2" }
sevenz-rust2 = { version = "0.21", features = ["aes256", "bzip2", "deflate", "zstd"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
zstd = "0.13"
lzma-rs = "0.3"
tempfile = "3"
alass-core = "2.0.0"
chardetng = "1"
encoding_rs = "0.8"
symphonia = { version = "0.5", features = ["aac", "flac", "mp3", "vorbis", "pcm", "mkv", "isomp4"] }
unicode-normalization = "0.1"
whatlang = "0.16"
regex = "1"
blake3 = "1"
const-oid = "0.9"
sigstore = { version = "0.13", default-features = false, features = ["cosign", "sigstore-trust-root", "rustls-tls"] }
base64 = "0.22"
rustls-pki-types = "1"
rustls-webpki = "0.103"
x509-cert = "0.2"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = { workspace = true }
