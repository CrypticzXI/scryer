[package]
name = "scryer-application"
version = "0.16.7"
edition.workspace = true

[features]
default = []
runtime = [
    "runtime-archives",
    "runtime-backups",
    "runtime-media-analysis",
    "runtime-plugin-trust",
]
runtime-archives = [
    "dep:flate2",
    "dep:lzma-rs",
    "dep:sevenz-rust2",
    "dep:weaver-rar",
    "dep:zip",
]
runtime-backups = ["dep:tar", "dep:zstd"]
runtime-media-analysis = [
    "dep:chardetng",
    "dep:encoding_rs",
    "dep:scryer-mediainfo",
    "dep:whatlang",
]
runtime-plugin-trust = [
    "dep:brotli",
    "dep:rustls-pki-types",
    "dep:rustls-webpki",
    "dep:sigstore",
    "dep:x509-cert",
    "dep:zstd",
]

[dependencies]
scryer-domain = { path = "../scryer-domain" }
scryer-plugin-sdk = { path = "../scryer-plugin-sdk" }
scryer-release-parser = { path = "../scryer-release-parser" }
scryer-rules = { path = "../scryer-rules" }
scryer-mediainfo = { path = "../scryer-mediainfo", optional = true }
scryer-outbound-http = { path = "../scryer-outbound-http" }
scryer-runtime-info = { path = "../scryer-runtime-info" }
jsonwebtoken = { workspace = true }
rand_core = { workspace = true }
argon2 = { workspace = true }
aws-lc-rs = { workspace = true }
uuid = { workspace = true }
webauthn-rs = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "http2", "gzip", "brotli", "deflate"] }
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }
metrics = { workspace = true }
base64 = "0.22"
brotli = { version = "8", optional = true }
weaver-rar = { git = "https://github.com/scryer-media/weaver.git", tag = "weaver-v0.5.3", default-features = false, optional = true }
sevenz-rust2 = { version = "0.21", features = ["aes256", "bzip2", "deflate", "zstd"], optional = true }
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
zstd = { version = "0.13", default-features = false, optional = true }
lzma-rs = { version = "0.3", optional = true }
tempfile = "3"
chardetng = { version = "1", optional = true }
encoding_rs = { version = "0.8", optional = true }
unicode-normalization = "0.1"
whatlang = { version = "0.18.0", optional = true }
regex = "1"
blake3 = "1"
const-oid = { version = "0.10.2", features = ["db"] }
sigstore = { version = "0.14", default-features = false, features = ["cosign", "sigstore-trust-root", "rustls-tls"], optional = true }
rustls-pki-types = { version = "1", optional = true }
rustls-webpki = { version = "0.103", optional = true }
x509-cert = { version = "0.2", default-features = false, features = ["pem", "std"], optional = true }
url = "2"
rustls-pemfile = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion.workspace = true
wiremock = { workspace = true }
