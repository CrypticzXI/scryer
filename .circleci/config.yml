version: 2.1

# Required contexts:
# - scryer-build:
#   - SCRYER_SMG_REGISTRATION_SECRET
#   - APPLE_SIGNING_CERT_P12
#   - APPLE_SIGNING_CERT_PASSWORD
# - scryer-release:
#   - GITHUB_TOKEN
#   - GHCR_TOKEN
#   - optional GHCR_USERNAME (defaults to CIRCLE_PROJECT_USERNAME)
#   - TAP_TOKEN
#   - WEB_TOKEN
#   - SCRYER_CIRCLECI_ENABLE_DOCKER_PUBLISH=true to allow docker pushes
#   - SCRYER_CIRCLECI_ENABLE_RELEASE_PUBLISH=true to allow GitHub releases
#   - SCRYER_CIRCLECI_ENABLE_HOMEBREW_UPDATE=true to allow tap updates
#   - SCRYER_CIRCLECI_ENABLE_SITE_REBUILD=true to allow site rebuild triggers

executors:
  linux-medium:
    machine:
      image: ubuntu-2404:current
    resource_class: large
  linux-arm-medium:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
  macos-medium:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
  windows-medium:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium

commands:
  fetch_full_history:
    steps:
      - run:
          name: Fetch tags and full history
          command: |
            git fetch --force --tags --prune
            git fetch --unshallow || true

  setup_node_25:
    steps:
      - run:
          name: Install Node.js 25
          command: |
            export NVM_DIR="$HOME/.nvm"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            fi
            {
              echo 'export NVM_DIR="$HOME/.nvm"'
              echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"'
              echo 'nvm install 25'
              echo 'nvm alias default 25'
              echo 'nvm use 25 >/dev/null'
            } >> "$BASH_ENV"
            . "$BASH_ENV"
            node --version
            npm --version

  setup_rust_unix:
    parameters:
      toolchain:
        type: string
        default: "1.95.0"
      component:
        type: string
        default: ""
      target:
        type: string
        default: ""
    steps:
      - run:
          name: Install Rust << parameters.toolchain >>
          command: |
            mkdir -p "$HOME/.cargo/bin" "$HOME/.rustup"
            if [ ! -f "$HOME/.cargo/env" ]; then
              printf '%s\n' 'export PATH="$HOME/.cargo/bin:$PATH"' > "$HOME/.cargo/env"
            fi
            if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
            fi
            {
              echo 'export PATH="$HOME/.cargo/bin:$PATH"'
              echo '[ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"'
            } >> "$BASH_ENV"
            . "$BASH_ENV"
            rustup set profile minimal
            rustup toolchain install "<< parameters.toolchain >>"
            rustup default "<< parameters.toolchain >>"
            if [ -n "<< parameters.component >>" ]; then
              rustup component add "<< parameters.component >>"
            fi
            if [ -n "<< parameters.target >>" ]; then
              rustup target add "<< parameters.target >>"
            fi
            cargo --version
            rustc --version

  restore_rust_cache_unix:
    parameters:
      key_prefix:
        type: string
    steps:
      - restore_cache:
          keys:
            - v3-rust-unix-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
            - v3-rust-unix-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}
            - v3-rust-unix-<< parameters.key_prefix >>

  save_rust_cache_unix:
    parameters:
      key_prefix:
        type: string
    steps:
      - save_cache:
          key: v3-rust-unix-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/env
            - ~/.cargo/git
            - ~/.cargo/registry
            - ~/.rustup

  restore_sccache_unix:
    parameters:
      key_prefix:
        type: string
    steps:
      - restore_cache:
          keys:
            - v1-sccache-unix-<< parameters.key_prefix >>-{{ .Branch }}-
            - v1-sccache-unix-<< parameters.key_prefix >>-

  save_sccache_unix:
    parameters:
      key_prefix:
        type: string
    steps:
      - save_cache:
          key: v1-sccache-unix-<< parameters.key_prefix >>-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.cache/sccache

  setup_sccache_unix:
    parameters:
      asset_name:
        type: string
      sha256:
        type: string
    steps:
      - run:
          name: Install sccache
          command: |
            mkdir -p "$HOME/.cargo/bin" "$HOME/.cache/sccache"
            if [ ! -x "$HOME/.cargo/bin/sccache" ]; then
              rm -rf /tmp/sccache-install
              mkdir -p /tmp/sccache-install
              curl -fsSL -o /tmp/sccache.tar.gz "https://github.com/mozilla/sccache/releases/download/v0.15.0/<< parameters.asset_name >>"
              if command -v sha256sum >/dev/null 2>&1; then
                echo "<< parameters.sha256 >>  /tmp/sccache.tar.gz" | sha256sum -c -
              else
                echo "<< parameters.sha256 >>  /tmp/sccache.tar.gz" | shasum -a 256 -c -
              fi
              tar -xzf /tmp/sccache.tar.gz -C /tmp/sccache-install
              SCCACHE_BIN=$(find /tmp/sccache-install -type f -name sccache | head -n 1)
              install "$SCCACHE_BIN" "$HOME/.cargo/bin/sccache"
            fi
            {
              echo 'export RUSTC_WRAPPER="$HOME/.cargo/bin/sccache"'
              echo 'export SCCACHE_DIR="$HOME/.cache/sccache"'
              echo 'export SCCACHE_CACHE_SIZE="10G"'
              echo 'export CARGO_INCREMENTAL=0'
            } >> "$BASH_ENV"
            . "$BASH_ENV"
            sccache --start-server || true
            sccache --version

  show_sccache_stats_unix:
    steps:
      - run:
          name: Show sccache stats
          command: |
            . "$BASH_ENV"
            if command -v sccache >/dev/null 2>&1; then
              sccache --show-stats || true
            fi

  restore_rust_cache_windows:
    steps:
      - restore_cache:
          keys:
            - v1-rust-windows-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
            - v1-rust-windows-{{ checksum "rust-toolchain.toml" }}
            - v1-rust-windows

  save_rust_cache_windows:
    steps:
      - save_cache:
          key: v1-rust-windows-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
          paths:
            - C:\Users\circleci\.cargo\bin
            - C:\Users\circleci\.cargo\git
            - C:\Users\circleci\.cargo\registry
            - C:\Users\circleci\.rustup

  restore_sccache_windows:
    parameters:
      key_prefix:
        type: string
    steps:
      - restore_cache:
          keys:
            - v1-sccache-windows-<< parameters.key_prefix >>-{{ .Branch }}-
            - v1-sccache-windows-<< parameters.key_prefix >>-

  save_sccache_windows:
    parameters:
      key_prefix:
        type: string
    steps:
      - save_cache:
          key: v1-sccache-windows-<< parameters.key_prefix >>-{{ .Branch }}-{{ .Revision }}
          paths:
            - C:\Users\circleci\AppData\Local\Mozilla\sccache

  restore_target_cache:
    parameters:
      key_prefix:
        type: string
    steps:
      - restore_cache:
          keys:
            - v1-target-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
            - v1-target-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}
            - v1-target-<< parameters.key_prefix >>

  save_target_cache:
    parameters:
      key_prefix:
        type: string
      path:
        type: string
    steps:
      - save_cache:
          key: v1-target-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
          paths:
            - << parameters.path >>

  attach_repo_workspace:
    steps:
      - attach_workspace:
          at: .

  persist_release_artifact:
    parameters:
      path:
        type: string
    steps:
      - persist_to_workspace:
          root: .
          paths:
            - << parameters.path >>
      - store_artifacts:
          path: << parameters.path >>

jobs:
  web:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - setup_node_25
      - run:
          name: Install dependencies
          command: |
            . "$BASH_ENV"
            cd apps/scryer-web
            npm ci
      - run:
          name: Lint
          command: |
            . "$BASH_ENV"
            cd apps/scryer-web
            npm run lint
      - run:
          name: Build web app
          environment:
            SCRYER_GRAPHQL_URL: /graphql
            SCRYER_METADATA_GATEWAY_GRAPHQL_URL: https://smg.scryer.media/graphql
          command: |
            . "$BASH_ENV"
            cd apps/scryer-web
            npm run build
      - run:
          name: Verify static output
          command: test -f apps/scryer-web/dist/index.html
      - persist_to_workspace:
          root: .
          paths:
            - apps/scryer-web/dist
      - store_artifacts:
          path: apps/scryer-web/dist

  rust-check:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix:
          key_prefix: linux-check
      - restore_target_cache:
          key_prefix: linux-check
      - setup_rust_unix:
          component: clippy
      - setup_sccache_unix:
          asset_name: sccache-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          sha256: 782d2b5dd7ae0a55ebe368ab258114d0928d019ac2d949ab85d5d02f3926709e
      - run:
          name: Install system dependencies
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm
      - run:
          name: Install cargo-nextest
          command: |
            . "$BASH_ENV"
            if ! command -v cargo-nextest >/dev/null 2>&1; then
              cargo install cargo-nextest --locked
            fi
      - run:
          name: Run clippy for production binary packages
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-check
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            export RUSTC_WRAPPER="$HOME/.cargo/bin/sccache"
            export SCCACHE_DIR="$HOME/.cache/sccache"
            export SCCACHE_CACHE_SIZE="10G"
            export CARGO_INCREMENTAL=0
            sccache --zero-stats || true
            cargo clippy --locked \
              -p scryer \
              -p scryer-application \
              -p scryer-domain \
              -p scryer-infrastructure \
              -p scryer-interface \
              -p scryer-mediainfo \
              -p scryer-plugins \
              -p scryer-release-parser \
              -p scryer-rules \
              -- -D warnings
      - run:
          name: Run production binary package tests
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-check
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
            RUST_MIN_STACK: "4194304"
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            export RUSTC_WRAPPER="$HOME/.cargo/bin/sccache"
            export SCCACHE_DIR="$HOME/.cache/sccache"
            export SCCACHE_CACHE_SIZE="10G"
            export CARGO_INCREMENTAL=0
            cargo nextest run --locked \
              -p scryer \
              -p scryer-application \
              -p scryer-domain \
              -p scryer-infrastructure \
              -p scryer-interface \
              -p scryer-mediainfo \
              -p scryer-plugins \
              -p scryer-release-parser \
              -p scryer-rules
            sccache --show-stats || true
      - save_target_cache:
          key_prefix: linux-check
          path: target/ci-linux-check
      - save_rust_cache_unix:
          key_prefix: linux-check

  rust-build-linux-x86_64-portable:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix:
          key_prefix: linux-x86_64-portable-release
      - restore_sccache_unix:
          key_prefix: linux-x86_64-portable-release
      - setup_rust_unix:
          target: x86_64-unknown-linux-musl
      - setup_sccache_unix:
          asset_name: sccache-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          sha256: 782d2b5dd7ae0a55ebe368ab258114d0928d019ac2d949ab85d5d02f3926709e
      - run:
          name: Install mold
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold musl-tools nasm
      - run:
          name: Build portable release binary (Linux x86_64 + embedded UI)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-x86_64-portable-release
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            export SCCACHE_ERROR_LOG="/tmp/sccache.log"
            export SCCACHE_LOG="debug"
            export RUSTFLAGS="-C link-arg=-fuse-ld=mold"
            : > /tmp/sccache.log
            : > /tmp/sccache-watchdog.log
            sccache --stop-server >/dev/null 2>&1 || true
            sccache --start-server || true
            {
              echo '=== toolchain ==='
              rustc --version
              cargo --version
              sccache --version
              echo
              echo '=== wrapper ==='
              command -v sccache
              type -a sccache
              echo
              echo '=== env ==='
              env | sort | grep -E '^(RUSTC_WRAPPER|CARGO_BUILD_RUSTC_WRAPPER|SCCACHE|RUSTFLAGS|CARGO_TARGET_DIR)=' || true
              echo
              echo '=== memory-before ==='
              free -h
              echo
              echo '=== ulimit ==='
              ulimit -a
              echo
              echo '=== sccache-before ==='
              pgrep -af sccache || true
              ps -o pid,ppid,etimes,%mem,rss,vsz,command -C sccache || true
            } | tee /tmp/sccache-diagnostics.txt
            (
              while true; do
                ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                pid="$(pgrep -xo sccache || true)"
                if [ -n "$pid" ]; then
                  echo "[$ts] pid=$pid alive" >> /tmp/sccache-watchdog.log
                  ps -o pid,ppid,etimes,%mem,rss,vsz,command -p "$pid" >> /tmp/sccache-watchdog.log || true
                else
                  echo "[$ts] pid-missing" >> /tmp/sccache-watchdog.log
                  break
                fi
                sleep 15
              done
            ) &
            WATCHDOG_PID=$!
            trap 'kill "$WATCHDOG_PID" >/dev/null 2>&1 || true' EXIT
            sccache --zero-stats || true
            /usr/bin/time -v cargo build -vv -p scryer --release --locked --target x86_64-unknown-linux-musl 2>&1 | tee /tmp/scryer-build.log
            kill "$WATCHDOG_PID" >/dev/null 2>&1 || true
            wait "$WATCHDOG_PID" 2>/dev/null || true
            {
              echo
              echo '=== sccache-after ==='
              pgrep -af sccache || true
              ps -o pid,ppid,etimes,%mem,rss,vsz,command -C sccache || true
              echo
              echo '=== memory-after ==='
              free -h
              echo
              echo '=== disk-after ==='
              du -sh "$HOME/.cache/sccache" "$CARGO_TARGET_DIR" || true
            } | tee -a /tmp/sccache-diagnostics.txt
            sccache --show-stats | tee /tmp/sccache-stats.txt
            {
              echo
              echo '=== sccache-log-tail ==='
              tail -n 200 /tmp/sccache.log || true
            } | tee -a /tmp/sccache-diagnostics.txt
      - store_artifacts:
          path: /tmp/scryer-build.log
      - store_artifacts:
          path: /tmp/sccache-stats.txt
      - store_artifacts:
          path: /tmp/sccache-diagnostics.txt
      - store_artifacts:
          path: /tmp/sccache.log
      - store_artifacts:
          path: /tmp/sccache-watchdog.log
      - save_sccache_unix:
          key_prefix: linux-x86_64-portable-release
      - save_rust_cache_unix:
          key_prefix: linux-x86_64-portable-release

  rust-build-linux-x86_64-haswell:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix:
          key_prefix: linux-x86_64-haswell-release
      - restore_target_cache:
          key_prefix: linux-x86_64-haswell-release
      - setup_rust_unix:
          target: x86_64-unknown-linux-musl
      - setup_sccache_unix:
          asset_name: sccache-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          sha256: 782d2b5dd7ae0a55ebe368ab258114d0928d019ac2d949ab85d5d02f3926709e
      - run:
          name: Install system dependencies
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold musl-tools nasm
      - run:
          name: Build optimized release binary (Linux x86_64 haswell + embedded UI)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-x86_64-haswell-release
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
            RUSTFLAGS: -C target-cpu=haswell
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            export RUSTC_WRAPPER="$HOME/.cargo/bin/sccache"
            export SCCACHE_DIR="$HOME/.cache/sccache"
            export SCCACHE_CACHE_SIZE="10G"
            export CARGO_INCREMENTAL=0
            sccache --zero-stats || true
            mold -run cargo build -p scryer --release --locked --target x86_64-unknown-linux-musl
            sccache --show-stats || true
      - save_target_cache:
          key_prefix: linux-x86_64-haswell-release
          path: target/ci-linux-x86_64-haswell-release
      - save_rust_cache_unix:
          key_prefix: linux-x86_64-haswell-release
      - run:
          name: Package optimized tarball
          command: |
            mkdir -p release-artifacts
            tar -czf release-artifacts/scryer-linux-x86_64-haswell.tar.gz -C target/ci-linux-x86_64-haswell-release/x86_64-unknown-linux-musl/release scryer
      - persist_release_artifact:
          path: release-artifacts/scryer-linux-x86_64-haswell.tar.gz

  rust-build-linux-arm64-portable:
    executor: linux-arm-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix:
          key_prefix: linux-arm64-portable-release
      - restore_target_cache:
          key_prefix: linux-arm64-portable-release
      - setup_rust_unix:
          target: aarch64-unknown-linux-musl
      - setup_sccache_unix:
          asset_name: sccache-v0.15.0-aarch64-unknown-linux-musl.tar.gz
          sha256: 3a6a3712b49da3d263bf2d30d702de4302793016019e800bfb81c0c69401d8f8
      - run:
          name: Install system dependencies
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold musl-tools nasm
      - run:
          name: Build portable release binary (Linux arm64 + embedded UI)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-arm64-portable-release
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
            RUSTFLAGS: --cfg aes_armv8 --cfg chacha20_force_neon
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            export RUSTC_WRAPPER="$HOME/.cargo/bin/sccache"
            export SCCACHE_DIR="$HOME/.cache/sccache"
            export SCCACHE_CACHE_SIZE="10G"
            export CARGO_INCREMENTAL=0
            sccache --zero-stats || true
            mold -run cargo build -p scryer --release --locked --target aarch64-unknown-linux-musl
            sccache --show-stats || true
      - save_target_cache:
          key_prefix: linux-arm64-portable-release
          path: target/ci-linux-arm64-portable-release
      - save_rust_cache_unix:
          key_prefix: linux-arm64-portable-release
      - run:
          name: Package portable tarballs
          command: |
            mkdir -p release-artifacts
            tar -czf release-artifacts/scryer-linux-arm64-portable.tar.gz -C target/ci-linux-arm64-portable-release/aarch64-unknown-linux-musl/release scryer
            cp release-artifacts/scryer-linux-arm64-portable.tar.gz release-artifacts/scryer-linux-arm64.tar.gz
      - persist_release_artifact:
          path: release-artifacts/scryer-linux-arm64.tar.gz
      - persist_release_artifact:
          path: release-artifacts/scryer-linux-arm64-portable.tar.gz

  rust-build-linux-arm64-cortex-a76:
    executor: linux-arm-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix:
          key_prefix: linux-arm64-cortex-a76-release
      - restore_target_cache:
          key_prefix: linux-arm64-cortex-a76-release
      - setup_rust_unix:
          target: aarch64-unknown-linux-musl
      - setup_sccache_unix:
          asset_name: sccache-v0.15.0-aarch64-unknown-linux-musl.tar.gz
          sha256: 3a6a3712b49da3d263bf2d30d702de4302793016019e800bfb81c0c69401d8f8
      - run:
          name: Install system dependencies
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold musl-tools nasm
      - run:
          name: Build optimized release binary (Linux arm64 cortex-a76 + embedded UI)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-arm64-cortex-a76-release
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
            RUSTFLAGS: -C target-cpu=cortex-a76 --cfg aes_armv8 --cfg chacha20_force_neon
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            export RUSTC_WRAPPER="$HOME/.cargo/bin/sccache"
            export SCCACHE_DIR="$HOME/.cache/sccache"
            export SCCACHE_CACHE_SIZE="10G"
            export CARGO_INCREMENTAL=0
            sccache --zero-stats || true
            mold -run cargo build -p scryer --release --locked --target aarch64-unknown-linux-musl
            sccache --show-stats || true
      - save_target_cache:
          key_prefix: linux-arm64-cortex-a76-release
          path: target/ci-linux-arm64-cortex-a76-release
      - save_rust_cache_unix:
          key_prefix: linux-arm64-cortex-a76-release
      - run:
          name: Package optimized tarball
          command: |
            mkdir -p release-artifacts
            tar -czf release-artifacts/scryer-linux-arm64-cortex-a76.tar.gz -C target/ci-linux-arm64-cortex-a76-release/aarch64-unknown-linux-musl/release scryer
      - persist_release_artifact:
          path: release-artifacts/scryer-linux-arm64-cortex-a76.tar.gz

  rust-build-macos-arm64:
    executor: macos-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix:
          key_prefix: macos-arm64-release
      - restore_target_cache:
          key_prefix: macos-arm64-release
      - setup_rust_unix
      - setup_sccache_unix:
          asset_name: sccache-v0.15.0-aarch64-apple-darwin.tar.gz
          sha256: 430ef7b5f54256d3ed5bfe77e8b0afc51aa209aeebe4f95b69c3a52ce3acc6e9
      - run:
          name: Install system dependencies
          command: brew install nasm
      - run:
          name: Build release binary (macOS arm64)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-macos-arm64-release
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
            RUSTFLAGS: -C target-cpu=apple-m1 --cfg aes_armv8 --cfg chacha20_force_neon
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            cargo build -p scryer --release --locked
      - save_target_cache:
          key_prefix: macos-arm64-release
          path: target/ci-macos-arm64-release
      - show_sccache_stats_unix
      - save_rust_cache_unix:
          key_prefix: macos-arm64-release
      - run:
          name: Codesign binary
          command: |
            KEYCHAIN="build.keychain-db"
            KEYCHAIN_PASS="ci-ephemeral"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security set-keychain-settings -lut 900 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            printf '%s' "$APPLE_SIGNING_CERT_P12" | tr -d '\r\n' | base64 --decode > /tmp/cert.p12
            security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$APPLE_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
            codesign --sign "Scryer Media Signing" --identifier media.scryer.app --force target/ci-macos-arm64-release/release/scryer
            codesign --verify --verbose target/ci-macos-arm64-release/release/scryer
            rm /tmp/cert.p12
            security delete-keychain "$KEYCHAIN"
      - run:
          name: Package tarball
          command: |
            mkdir -p release-artifacts
            tar -czf release-artifacts/scryer-darwin-arm64.tar.gz -C target/ci-macos-arm64-release/release scryer
      - persist_release_artifact:
          path: release-artifacts/scryer-darwin-arm64.tar.gz

  rust-build-windows-scryer:
    executor: windows-medium
    working_directory: C:\Users\circleci\project
    steps:
      - checkout
      - run:
          name: Configure git for tag fetches
          command: git fetch --force --tags --prune
      - attach_repo_workspace
      - restore_rust_cache_windows
      - restore_sccache_windows:
          key_prefix: windows-scryer-release
      - run:
          name: Install Rust 1.95.0
          command: |
            if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
              choco install rustup.install -y
            }
            $Env:Path = "$HOME\.cargo\bin;$Env:Path"
            [Environment]::SetEnvironmentVariable("Path", $Env:Path, "Process")
            rustup set profile minimal
            rustup toolchain install 1.95.0-x86_64-pc-windows-msvc
            rustup target add --toolchain 1.95.0-x86_64-pc-windows-msvc x86_64-pc-windows-msvc
            rustup default 1.95.0-x86_64-pc-windows-msvc
            rustup show active-toolchain
            cargo --version
            rustc --version
      - run:
          name: Install sccache
          command: |
            $version = "0.15.0"
            $asset = "sccache-v${version}-x86_64-pc-windows-msvc.zip"
            $assetUrl = "https://github.com/mozilla/sccache/releases/download/v${version}/${asset}"
            $expectedSha256 = "dcf489090aa5ef4c7d145e8b29f759124c803d636c3107f397bd50d425b5f341"
            Invoke-WebRequest $assetUrl -OutFile sccache.zip
            $actualSha256 = (Get-FileHash sccache.zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) {
              throw "sccache checksum mismatch: expected $expectedSha256, got $actualSha256"
            }
            Remove-Item -Recurse -Force C:\sccache-install -ErrorAction SilentlyContinue
            Expand-Archive sccache.zip -DestinationPath C:\sccache-install
            $dir = (Get-ChildItem C:\sccache-install -Directory | Select-Object -First 1).FullName
            $bin = Join-Path $dir "sccache.exe"
            if (-not (Test-Path $bin)) {
              throw "sccache.exe not found under $dir"
            }
            $Env:Path = "$dir;$HOME\.cargo\bin;$Env:Path"
            [Environment]::SetEnvironmentVariable("Path", $Env:Path, "Process")
            New-Item -ItemType Directory -Force -Path "$Env:LOCALAPPDATA\Mozilla\sccache" | Out-Null
            & $bin --version
      - run:
          name: Build release binary with sccache (Windows x86_64 + embedded UI)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: C:\Users\circleci\project\target\ci-windows-x86_64-release
            SCCACHE_DIR: C:\Users\circleci\AppData\Local\Mozilla\sccache
            SCCACHE_CACHE_SIZE: 10G
            SCCACHE_LOG: debug
            SCCACHE_ERROR_LOG: C:\Users\circleci\project\tmp\sccache.log
            SCCACHE_BASEDIRS: C:\Users\circleci\project
            CARGO_INCREMENTAL: "0"
          command: |
            $ErrorActionPreference = "Stop"
            New-Item -ItemType Directory -Force -Path C:\Users\circleci\project\tmp | Out-Null
            "" | Set-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            "" | Set-Content -Path C:\Users\circleci\project\tmp\sccache.log
            "" | Set-Content -Path C:\Users\circleci\project\tmp\sccache-watchdog.log
            $vswhere = Join-Path ${Env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vsPath) {
              throw "Unable to locate a Visual Studio installation with MSVC build tools"
            }
            $vsInstaller = Join-Path ${Env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\setup.exe"
            if (-not (Test-Path $vsInstaller)) {
              throw "Visual Studio installer not found at $vsInstaller"
            }
            "Installing Spectre-mitigated MSVC runtime libs into $vsPath" | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            $spectreComponents = @(
              "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre",
              "Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64.Spectre"
            )
            $spectreArgs = @(
              "modify",
              "--installPath", $vsPath
            )
            foreach ($component in $spectreComponents) {
              $spectreArgs += @("--add", $component)
            }
            $spectreArgs += @(
              "--quiet",
              "--wait",
              "--norestart"
            )
            & $vsInstaller @spectreArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Visual Studio installer failed while adding Spectre libs with exit code $LASTEXITCODE"
            }
            $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
            cmd.exe /s /c "`"$vsDevCmd`" -arch=x64 -host_arch=x64 && set" |
              ForEach-Object {
                if ($_ -match '^(.*?)=(.*)$') {
                  [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2], "Process")
                }
              }
            $sccacheDir = (Get-ChildItem C:\sccache-install -Directory | Select-Object -First 1).FullName
            $sccacheBin = Join-Path $sccacheDir "sccache.exe"
            if (-not (Test-Path $sccacheBin)) {
              throw "sccache.exe not found at $sccacheBin"
            }
            $toolchainBin = Join-Path $HOME ".rustup\toolchains\1.95.0-x86_64-pc-windows-msvc\bin"
            $cargoExe = Join-Path $toolchainBin "cargo.exe"
            $rustcExe = Join-Path $toolchainBin "rustc.exe"
            if (-not (Test-Path $cargoExe)) {
              throw "cargo.exe not found at $cargoExe"
            }
            if (-not (Test-Path $rustcExe)) {
              throw "rustc.exe not found at $rustcExe"
            }
            $Env:Path = "$toolchainBin;$HOME\.cargo\bin;$Env:Path"
            [Environment]::SetEnvironmentVariable("Path", $Env:Path, "Process")
            $Env:CARGO = $cargoExe
            $Env:RUSTC = $rustcExe
            $Env:RUSTC_WRAPPER = $sccacheBin
            $Env:CARGO_BUILD_TARGET = "x86_64-pc-windows-msvc"
            $Env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = "link.exe"
            $Env:RUSTFLAGS = "-C linker=link.exe -C linker-flavor=msvc"
            $Env:SCRYER_SMG_GRAPHQL_URL = "https://smg.scryer.media/graphql"
            $Env:SCRYER_EMBED_UI_DIR = "C:\Users\circleci\project\apps\scryer-web\dist"
            Remove-Item Env:CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER -ErrorAction SilentlyContinue
            "=== before build ===" | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            Get-Date -Format o | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            "RUSTC_WRAPPER=$Env:RUSTC_WRAPPER" | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            "SCCACHE_DIR=$Env:SCCACHE_DIR" | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            "$sccacheBin" | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            "$cargoExe" | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            "$rustcExe" | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            where.exe rustc | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            where.exe cargo | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            where.exe link | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            Get-Process sccache -ErrorAction SilentlyContinue | Format-List * | Out-String | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize,FreePhysicalMemory | Format-List | Out-String | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt

            "Skipping sccache --stop-server on Windows to avoid PowerShell native-command stderr termination." | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            & $sccacheBin --start-server | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "sccache --start-server failed with exit code $LASTEXITCODE"
            }
            & $sccacheBin --zero-stats | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "sccache --zero-stats failed with exit code $LASTEXITCODE"
            }

            $watchdog = Start-Job -ScriptBlock {
              while ($true) {
                $stamp = Get-Date -Format o
                Add-Content -Path C:\Users\circleci\project\tmp\sccache-watchdog.log -Value "[$stamp]"
                Get-Process sccache -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,WS,PM,CPU,StartTime | Format-Table -AutoSize | Out-String | Add-Content -Path C:\Users\circleci\project\tmp\sccache-watchdog.log
                Start-Sleep -Seconds 15
              }
            }

            Measure-Command {
              cmd.exe /d /s /c """$cargoExe"" build -vv -p scryer --release --locked --target x86_64-pc-windows-msvc > C:\Users\circleci\project\tmp\windows-scryer-build.log 2>&1"
            } | Format-List * | Out-String | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            if ($LASTEXITCODE -ne 0) {
              throw "cargo build failed with exit code $LASTEXITCODE"
            }
            Get-Content C:\Users\circleci\project\tmp\windows-scryer-build.log -Tail 200

            Stop-Job $watchdog -ErrorAction SilentlyContinue
            Receive-Job $watchdog -ErrorAction SilentlyContinue | Out-Null
            Remove-Job $watchdog -ErrorAction SilentlyContinue

            "=== after build ===" | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            Get-Date -Format o | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            Get-Process sccache -ErrorAction SilentlyContinue | Format-List * | Out-String | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize,FreePhysicalMemory | Format-List | Out-String | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            Get-ChildItem Env: | Where-Object { $_.Name -like "SCCACHE*" -or $_.Name -like "RUSTC_WRAPPER" -or $_.Name -like "CARGO_*" } | Sort-Object Name | Format-Table -AutoSize | Out-String | Add-Content -Path C:\Users\circleci\project\tmp\sccache-diagnostics.txt
            & $sccacheBin --show-stats | Tee-Object -FilePath C:\Users\circleci\project\tmp\sccache-stats.txt
            Get-Content C:\Users\circleci\project\tmp\sccache.log -Tail 200
      - save_rust_cache_windows
      - save_sccache_windows:
          key_prefix: windows-scryer-release
      - store_artifacts:
          path: tmp/windows-scryer-build.log
      - store_artifacts:
          path: tmp/sccache-stats.txt
      - store_artifacts:
          path: tmp/sccache-diagnostics.txt
      - store_artifacts:
          path: tmp/sccache-watchdog.log
      - store_artifacts:
          path: tmp/sccache.log

  docker-validate-amd64:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - run:
          name: Configure docker buildx
          command: |
            docker buildx rm scryer-circleci-validate-amd64 >/dev/null 2>&1 || true
            docker buildx create --use --name scryer-circleci-validate-amd64
      - run:
          name: Validate Docker runtime selector
          command: sh docker/test_runtime_select.sh
      - run:
          name: Validate Docker docs contract
          command: sh docker/test_docs_contract.sh
      - run:
          name: Prepare build context
          command: sh docker/prepare-build-context.sh release-artifacts docker-ctx
      - run:
          name: Build base validation image
          command: |
            docker buildx build \
              --platform linux/amd64 \
              --tag scryer:test-amd64 \
              --file docker/scryer.Dockerfile \
              --load \
              docker-ctx
      - run:
          name: Smoke test base image runtime
          command: sh docker/test_image_runtime.sh scryer:test-amd64 linux/amd64
      - run:
          name: Build slim validation image
          command: |
            docker buildx build \
              --platform linux/amd64 \
              --tag scryer:test-amd64-slim \
              --file docker/scryer.Dockerfile \
              --load \
              docker-ctx
      - run:
          name: Smoke test slim image runtime
          command: sh docker/test_image_runtime.sh scryer:test-amd64-slim linux/amd64
      - run:
          name: Build modern validation image
          command: |
            docker buildx build \
              --build-arg SCRYER_RUNTIME_MODE=modern \
              --platform linux/amd64 \
              --tag scryer:test-amd64-modern \
              --file docker/scryer.Dockerfile \
              --load \
              docker-ctx
      - run:
          name: Smoke test modern image runtime
          command: sh docker/test_modern_image_runtime.sh scryer:test-amd64-modern linux/amd64 amd64

