  docker-publish:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - run:
          name: Validate Docker runtime selector
          command: sh docker/test_runtime_select.sh
      - run:
          name: Validate Docker docs contract
          command: sh docker/test_docs_contract.sh
      - run:
          name: Prepare build context
          command: |
            sh docker/prepare-build-context.sh release-artifacts docker-ctx
      - run:
          name: Compute docker tags
          command: |
            case "$CIRCLE_TAG" in
              cci-scryer-v*) TAG_VERSION="${CIRCLE_TAG#cci-scryer-v}" ;;
              scryer-v*) TAG_VERSION="${CIRCLE_TAG#scryer-v}" ;;
              *) TAG_VERSION="$CIRCLE_TAG" ;;
            esac
            SHORT_SHA="$(printf '%s' "$CIRCLE_SHA1" | cut -c1-7)"
            IMAGE_NAME="ghcr.io/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            {
              echo "export SCRYER_DOCKER_TAG_VERSION=$TAG_VERSION"
              echo "export SCRYER_DOCKER_TAG_SHA=sha-$SHORT_SHA"
              echo "export SCRYER_DOCKER_IMAGE_NAME=$IMAGE_NAME"
            } >> "$BASH_ENV"
      - run:
          name: Build and push docker images
          command: |
            . "$BASH_ENV"
            if [ "${SCRYER_CIRCLECI_ENABLE_DOCKER_PUBLISH:-false}" = "true" ]; then
              USERNAME="${GHCR_USERNAME:-$CIRCLE_PROJECT_USERNAME}"
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$USERNAME" --password-stdin
              docker run --privileged --rm tonistiigi/binfmt --install amd64,arm64
              docker buildx rm scryer-circleci-publisher >/dev/null 2>&1 || true
              docker buildx create --use --name scryer-circleci-publisher

              base_tags=(
                --tag "${SCRYER_DOCKER_IMAGE_NAME}:latest"
                --tag "${SCRYER_DOCKER_IMAGE_NAME}:${SCRYER_DOCKER_TAG_SHA}"
                --tag "${SCRYER_DOCKER_IMAGE_NAME}:${SCRYER_DOCKER_TAG_VERSION}"
              )
              slim_tags=(
                --tag "${SCRYER_DOCKER_IMAGE_NAME}:latest-slim"
                --tag "${SCRYER_DOCKER_IMAGE_NAME}:${SCRYER_DOCKER_TAG_SHA}-slim"
                --tag "${SCRYER_DOCKER_IMAGE_NAME}:${SCRYER_DOCKER_TAG_VERSION}-slim"
              )
              modern_tags=(
                --tag "${SCRYER_DOCKER_IMAGE_NAME}:latest-modern"
                --tag "${SCRYER_DOCKER_IMAGE_NAME}:${SCRYER_DOCKER_TAG_SHA}-modern"
                --tag "${SCRYER_DOCKER_IMAGE_NAME}:${SCRYER_DOCKER_TAG_VERSION}-modern"
              )

              docker buildx build \
                --platform linux/amd64,linux/arm64 \
                "${base_tags[@]}" \
                --file docker/scryer.Dockerfile \
                --push \
                docker-ctx

              docker buildx build \
                --platform linux/amd64,linux/arm64 \
                "${slim_tags[@]}" \
                --file docker/scryer.Dockerfile \
                --output type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=19,force-compression=true \
                docker-ctx

              docker buildx build \
                --platform linux/amd64,linux/arm64 \
                "${modern_tags[@]}" \
                --file docker/scryer.Dockerfile \
                --build-arg SCRYER_RUNTIME_MODE=modern \
                --output type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=19,force-compression=true \
                docker-ctx
              exit 0
            fi
            echo "SCRYER_CIRCLECI_ENABLE_DOCKER_PUBLISH is not true; skipping docker push."

  publish-release:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - run:
          name: Prepare release artifacts
          command: |
            mkdir -p release-output
            cp release-artifacts/scryer-*.tar.gz release-output/
            cp release-artifacts/scryer-*.zip release-output/
            (cd release-output && shasum -a 256 scryer-*.tar.gz scryer-*.zip > scryer-checksums.txt)
      - store_artifacts:
          path: release-output
      - run:
          name: Publish GitHub release
          command: |
            if [ "${SCRYER_CIRCLECI_ENABLE_RELEASE_PUBLISH:-false}" != "true" ]; then
              echo "SCRYER_CIRCLECI_ENABLE_RELEASE_PUBLISH is not true; skipping GitHub release publish."
              exit 0
            fi
            if ! command -v gh >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y gh
            fi
            export GH_TOKEN="${GITHUB_TOKEN}"
            if gh release view "$CIRCLE_TAG" >/dev/null 2>&1; then
              gh release upload "$CIRCLE_TAG" release-output/* --clobber
            else
              gh release create "$CIRCLE_TAG" release-output/* --title "$CIRCLE_TAG" --generate-notes --verify-tag
            fi
      - run:
          name: Update Homebrew tap
          command: |
            if [ "${SCRYER_CIRCLECI_ENABLE_HOMEBREW_UPDATE:-false}" != "true" ]; then
              echo "SCRYER_CIRCLECI_ENABLE_HOMEBREW_UPDATE is not true; skipping Homebrew update."
              exit 0
            fi
            if [ -z "${TAP_TOKEN:-}" ]; then
              echo "TAP_TOKEN not set; skipping tap update."
              exit 0
            fi
            VERSION="${CIRCLE_TAG#scryer-v}"
            LINUX_X86_SHA=$(shasum -a 256 release-output/scryer-linux-x86_64.tar.gz | cut -d ' ' -f1)
            LINUX_ARM_SHA=$(shasum -a 256 release-output/scryer-linux-arm64.tar.gz | cut -d ' ' -f1)
            DARWIN_ARM_SHA=$(shasum -a 256 release-output/scryer-darwin-arm64.tar.gz | cut -d ' ' -f1)
            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            mkdir -p tap/Formula
            cat > tap/Formula/scryer.rb \<<FORMULA
            class Scryer < Formula
              desc "Self-hosted media acquisition and management platform"
              homepage "https://github.com/${REPO}"
              version "${VERSION}"
              license "MIT"

              def install_support_files
                (pkgshare/"config.env.example").write \<<~EOS
                  # Homebrew-managed Scryer service overrides.
                  SCRYER_BIND=127.0.0.1:8686
                EOS

                (libexec/"scryer-service").write \<<~SH
                  #!/bin/sh
                  CONFIG_FILE="#{etc}/scryer/config.env"

                  if [ -f "\$CONFIG_FILE" ]; then
                    set -a
                    . "\$CONFIG_FILE"
                    set +a
                  fi

                  exec "#{opt_bin}/scryer" --data-dir "#{var}/scryer" "\$@"
                SH

                chmod 0755, libexec/"scryer-service"
              end

              on_macos do
                on_arm do
                  url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-darwin-arm64.tar.gz"
                  sha256 "${DARWIN_ARM_SHA}"
                end
              end

              on_linux do
                on_arm do
                  url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-linux-arm64.tar.gz"
                  sha256 "${LINUX_ARM_SHA}"
                end

                on_intel do
                  url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-linux-x86_64.tar.gz"
                  sha256 "${LINUX_X86_SHA}"
                end
              end

              def install
                bin.install "scryer"
                install_support_files

                config_dir = etc/"scryer"
                config_dir.mkpath
                (var/"scryer").mkpath
                (var/"log").mkpath
                config_file = config_dir/"config.env"
                unless config_file.exist?
                  config_file.write \<<~EOS
                    SCRYER_BIND=127.0.0.1:8686
                  EOS
                end
              end

              def caveats
                \<<~EOS
                  Edit #{etc}/scryer/config.env to customize the Homebrew-managed service,
                  then restart it with:
                    brew services restart scryer
                EOS
              end

              service do
                run [opt_libexec/"scryer-service"]
                keep_alive true
                log_path var/"log/scryer.log"
                error_log_path var/"log/scryer.log"
              end

              test do
                assert_match "scryer", shell_output("#{bin}/scryer --version")
              end
            end
            FORMULA
            sed -i 's/^            //' tap/Formula/scryer.rb
            git clone "https://${TAP_TOKEN}@github.com/scryer-media/homebrew-scryer.git" tap-repo
            mkdir -p tap-repo/Formula
            cp tap/Formula/scryer.rb tap-repo/Formula/scryer.rb
            cd tap-repo
            git config user.name "circleci"
            git config user.email "ci@scryer.media"
            git add Formula/scryer.rb
            if git diff --cached --quiet; then
              echo "Homebrew tap already up to date."
            else
              git commit -m "scryer ${VERSION}"
              git push origin HEAD:main
            fi
      - run:
          name: Trigger marketing site rebuild
          command: |
            if [ "${SCRYER_CIRCLECI_ENABLE_SITE_REBUILD:-false}" != "true" ]; then
              echo "SCRYER_CIRCLECI_ENABLE_SITE_REBUILD is not true; skipping site rebuild."
              exit 0
            fi
            if [ -z "${WEB_TOKEN:-}" ]; then
              echo "WEB_TOKEN not set; skipping site rebuild."
              exit 0
            fi
            git clone "https://${WEB_TOKEN}@github.com/scryer-media/web.git" web-repo
            cd web-repo
            git config user.name "circleci"
            git config user.email "ci@scryer.media"
            git commit --allow-empty -m "rebuild: ${CIRCLE_TAG}"
            git push origin HEAD:main

workflows:
  scryer:
    jobs:
      - web:
          context: scryer-build
          filters: &release_tag_filters
            tags:
              only: /^(scryer-v|cci-scryer-v).*/
            branches:
              ignore: /.*/
      - rust-build-linux-x86_64-portable:
          context: scryer-build
          requires:
            - web
          filters: *release_tag_filters
