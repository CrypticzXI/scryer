version: 2.1

# Required contexts:
# - scryer-build:
#   - SCRYER_SMG_REGISTRATION_SECRET
#   - APPLE_SIGNING_CERT_P12
#   - APPLE_SIGNING_CERT_PASSWORD
# - scryer-release:
#   - GITHUB_TOKEN
#   - GHCR_TOKEN
#   - optional GHCR_USERNAME (defaults to CIRCLE_PROJECT_USERNAME)
#   - TAP_TOKEN
#   - WEB_TOKEN
#   - SCRYER_CIRCLECI_ENABLE_DOCKER_PUBLISH=true to allow docker pushes
#   - SCRYER_CIRCLECI_ENABLE_RELEASE_PUBLISH=true to allow GitHub releases
#   - SCRYER_CIRCLECI_ENABLE_HOMEBREW_UPDATE=true to allow tap updates
#   - SCRYER_CIRCLECI_ENABLE_SITE_REBUILD=true to allow site rebuild triggers

executors:
  linux-medium:
    machine:
      image: ubuntu-2404:current
    resource_class: large
  linux-arm-medium:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
  macos-medium:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
  windows-medium:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium

commands:
  fetch_full_history:
    steps:
      - run:
          name: Fetch tags and full history
          command: |
            git fetch --force --tags --prune
            git fetch --unshallow || true

  setup_node_25:
    steps:
      - run:
          name: Install Node.js 25
          command: |
            export NVM_DIR="$HOME/.nvm"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            fi
            {
              echo 'export NVM_DIR="$HOME/.nvm"'
              echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"'
              echo 'nvm install 25'
              echo 'nvm alias default 25'
              echo 'nvm use 25 >/dev/null'
            } >> "$BASH_ENV"
            . "$BASH_ENV"
            node --version
            npm --version

  setup_rust_unix:
    parameters:
      toolchain:
        type: string
        default: "1.95.0"
      component:
        type: string
        default: ""
      target:
        type: string
        default: ""
    steps:
      - run:
          name: Install Rust << parameters.toolchain >>
          command: |
            mkdir -p "$HOME/.cargo/bin" "$HOME/.rustup"
            if [ ! -f "$HOME/.cargo/env" ]; then
              printf '%s\n' 'export PATH="$HOME/.cargo/bin:$PATH"' > "$HOME/.cargo/env"
            fi
            if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
            fi
            {
              echo 'export PATH="$HOME/.cargo/bin:$PATH"'
              echo '[ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"'
            } >> "$BASH_ENV"
            . "$BASH_ENV"
            rustup set profile minimal
            rustup toolchain install "<< parameters.toolchain >>"
            rustup default "<< parameters.toolchain >>"
            if [ -n "<< parameters.component >>" ]; then
              rustup component add "<< parameters.component >>"
            fi
            if [ -n "<< parameters.target >>" ]; then
              rustup target add "<< parameters.target >>"
            fi
            cargo --version
            rustc --version

  restore_rust_cache_unix:
    parameters:
      key_prefix:
        type: string
    steps:
      - restore_cache:
          keys:
            - v3-rust-unix-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
            - v3-rust-unix-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}
            - v3-rust-unix-<< parameters.key_prefix >>

  save_rust_cache_unix:
    parameters:
      key_prefix:
        type: string
    steps:
      - save_cache:
          key: v3-rust-unix-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/env
            - ~/.cargo/git
            - ~/.cargo/registry
            - ~/.rustup

  restore_sccache_unix:
    parameters:
      key_prefix:
        type: string
    steps:
      - restore_cache:
          keys:
            - v1-sccache-unix-<< parameters.key_prefix >>-{{ .Branch }}-
            - v1-sccache-unix-<< parameters.key_prefix >>-

  save_sccache_unix:
    parameters:
      key_prefix:
        type: string
    steps:
      - save_cache:
          key: v1-sccache-unix-<< parameters.key_prefix >>-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.cache/sccache

  setup_sccache_unix:
    parameters:
      asset_name:
        type: string
      sha256:
        type: string
    steps:
      - run:
          name: Install sccache
          command: |
            mkdir -p "$HOME/.cargo/bin" "$HOME/.cache/sccache"
            if [ ! -x "$HOME/.cargo/bin/sccache" ]; then
              rm -rf /tmp/sccache-install
              mkdir -p /tmp/sccache-install
              curl -fsSL -o /tmp/sccache.tar.gz "https://github.com/mozilla/sccache/releases/download/v0.15.0/<< parameters.asset_name >>"
              if command -v sha256sum >/dev/null 2>&1; then
                echo "<< parameters.sha256 >>  /tmp/sccache.tar.gz" | sha256sum -c -
              else
                echo "<< parameters.sha256 >>  /tmp/sccache.tar.gz" | shasum -a 256 -c -
              fi
              tar -xzf /tmp/sccache.tar.gz -C /tmp/sccache-install
              SCCACHE_BIN=$(find /tmp/sccache-install -type f -name sccache | head -n 1)
              install "$SCCACHE_BIN" "$HOME/.cargo/bin/sccache"
            fi
            {
              echo 'export RUSTC_WRAPPER="$HOME/.cargo/bin/sccache"'
              echo 'export SCCACHE_DIR="$HOME/.cache/sccache"'
              echo 'export SCCACHE_CACHE_SIZE="10G"'
              echo 'export CARGO_INCREMENTAL=0'
            } >> "$BASH_ENV"
            . "$BASH_ENV"
            sccache --start-server || true
            sccache --version

  show_sccache_stats_unix:
    steps:
      - run:
          name: Show sccache stats
          command: |
            . "$BASH_ENV"
            if command -v sccache >/dev/null 2>&1; then
              sccache --show-stats || true
            fi

  restore_rust_cache_windows:
    steps:
      - restore_cache:
          keys:
            - v1-rust-windows-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
            - v1-rust-windows-{{ checksum "rust-toolchain.toml" }}
            - v1-rust-windows

  save_rust_cache_windows:
    steps:
      - save_cache:
          key: v1-rust-windows-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
          paths:
            - C:\Users\circleci\.cargo\bin
            - C:\Users\circleci\.cargo\git
            - C:\Users\circleci\.cargo\registry
            - C:\Users\circleci\.rustup

  restore_target_cache:
    parameters:
      key_prefix:
        type: string
    steps:
      - restore_cache:
          keys:
            - v1-target-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
            - v1-target-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}
            - v1-target-<< parameters.key_prefix >>

  save_target_cache:
    parameters:
      key_prefix:
        type: string
      path:
        type: string
    steps:
      - save_cache:
          key: v1-target-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
          paths:
            - << parameters.path >>

  attach_repo_workspace:
    steps:
      - attach_workspace:
          at: .

  persist_release_artifact:
    parameters:
      path:
        type: string
    steps:
      - persist_to_workspace:
          root: .
          paths:
            - << parameters.path >>
      - store_artifacts:
          path: << parameters.path >>

jobs:
  web:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - setup_node_25
      - run:
          name: Install dependencies
          command: |
            . "$BASH_ENV"
            cd apps/scryer-web
            npm ci
      - run:
          name: Lint
          command: |
            . "$BASH_ENV"
            cd apps/scryer-web
            npm run lint
      - run:
          name: Build web app
          environment:
            SCRYER_GRAPHQL_URL: /graphql
            SCRYER_METADATA_GATEWAY_GRAPHQL_URL: https://smg.scryer.media/graphql
          command: |
            . "$BASH_ENV"
            cd apps/scryer-web
            npm run build
      - run:
          name: Verify static output
          command: test -f apps/scryer-web/dist/index.html
      - persist_to_workspace:
          root: .
          paths:
            - apps/scryer-web/dist
      - store_artifacts:
          path: apps/scryer-web/dist

  rust-check:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix:
          key_prefix: linux-check
      - restore_target_cache:
          key_prefix: linux-check
      - setup_rust_unix:
          component: clippy
      - setup_sccache_unix:
          asset_name: sccache-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          sha256: 782d2b5dd7ae0a55ebe368ab258114d0928d019ac2d949ab85d5d02f3926709e
      - run:
          name: Install system dependencies
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm
      - run:
          name: Install cargo-nextest
          command: |
            . "$BASH_ENV"
            if ! command -v cargo-nextest >/dev/null 2>&1; then
              cargo install cargo-nextest --locked
            fi
      - run:
          name: Run clippy for production binary packages
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-check
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            export RUSTC_WRAPPER="$HOME/.cargo/bin/sccache"
            export SCCACHE_DIR="$HOME/.cache/sccache"
            export SCCACHE_CACHE_SIZE="10G"
            export CARGO_INCREMENTAL=0
            sccache --zero-stats || true
            cargo clippy --locked \
              -p scryer \
              -p scryer-application \
              -p scryer-domain \
              -p scryer-infrastructure \
              -p scryer-interface \
              -p scryer-mediainfo \
              -p scryer-plugins \
              -p scryer-release-parser \
              -p scryer-rules \
              -- -D warnings
      - run:
          name: Run production binary package tests
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-check
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
            RUST_MIN_STACK: "4194304"
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            export RUSTC_WRAPPER="$HOME/.cargo/bin/sccache"
            export SCCACHE_DIR="$HOME/.cache/sccache"
            export SCCACHE_CACHE_SIZE="10G"
            export CARGO_INCREMENTAL=0
            cargo nextest run --locked \
              -p scryer \
              -p scryer-application \
              -p scryer-domain \
              -p scryer-infrastructure \
              -p scryer-interface \
              -p scryer-mediainfo \
              -p scryer-plugins \
              -p scryer-release-parser \
              -p scryer-rules
            sccache --show-stats || true
      - save_target_cache:
          key_prefix: linux-check
          path: target/ci-linux-check
      - save_rust_cache_unix:
          key_prefix: linux-check

  rust-build-linux-x86_64-portable:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix:
          key_prefix: linux-x86_64-portable-release
      - restore_sccache_unix:
          key_prefix: linux-x86_64-portable-release
      - setup_rust_unix:
          target: x86_64-unknown-linux-musl
      - setup_sccache_unix:
          asset_name: sccache-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          sha256: 782d2b5dd7ae0a55ebe368ab258114d0928d019ac2d949ab85d5d02f3926709e
      - run:
          name: Install system dependencies
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold musl-tools nasm
      - run:
          name: Build portable release binary (Linux x86_64 + embedded UI)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-x86_64-portable-release
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            export RUSTC_WRAPPER="sccache"
            export CARGO_BUILD_RUSTC_WRAPPER="sccache"
            export SCCACHE_DIR="$HOME/.cache/sccache"
            export SCCACHE_CACHE_SIZE="10G"
            export CARGO_INCREMENTAL=0
            sccache --stop-server || true
            sccache --start-server || true
            sccache --zero-stats || true
            cat > /tmp/cargo-sccache-config.toml <<'EOF'
            [build]
            rustc-wrapper = "sccache"
            EOF
            cargo --config /tmp/cargo-sccache-config.toml build -p scryer --release --locked --target x86_64-unknown-linux-musl
            sccache --show-stats || true
      - save_sccache_unix:
          key_prefix: linux-x86_64-portable-release
      - save_rust_cache_unix:
          key_prefix: linux-x86_64-portable-release
      - run:
          name: Package portable tarballs
          command: |
            mkdir -p release-artifacts
            tar -czf release-artifacts/scryer-linux-x86_64-portable.tar.gz -C target/ci-linux-x86_64-portable-release/x86_64-unknown-linux-musl/release scryer
            cp release-artifacts/scryer-linux-x86_64-portable.tar.gz release-artifacts/scryer-linux-x86_64.tar.gz
      - persist_release_artifact:
          path: release-artifacts/scryer-linux-x86_64.tar.gz
      - persist_release_artifact:
          path: release-artifacts/scryer-linux-x86_64-portable.tar.gz

  rust-build-linux-x86_64-haswell:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix:
          key_prefix: linux-x86_64-haswell-release
      - restore_target_cache:
          key_prefix: linux-x86_64-haswell-release
      - setup_rust_unix:
          target: x86_64-unknown-linux-musl
      - setup_sccache_unix:
          asset_name: sccache-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          sha256: 782d2b5dd7ae0a55ebe368ab258114d0928d019ac2d949ab85d5d02f3926709e
      - run:
          name: Install system dependencies
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold musl-tools nasm
      - run:
          name: Build optimized release binary (Linux x86_64 haswell + embedded UI)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-x86_64-haswell-release
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
            RUSTFLAGS: -C target-cpu=haswell
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            export RUSTC_WRAPPER="$HOME/.cargo/bin/sccache"
            export SCCACHE_DIR="$HOME/.cache/sccache"
            export SCCACHE_CACHE_SIZE="10G"
            export CARGO_INCREMENTAL=0
            sccache --zero-stats || true
            mold -run cargo build -p scryer --release --locked --target x86_64-unknown-linux-musl
            sccache --show-stats || true
      - save_target_cache:
          key_prefix: linux-x86_64-haswell-release
          path: target/ci-linux-x86_64-haswell-release
      - save_rust_cache_unix:
          key_prefix: linux-x86_64-haswell-release
      - run:
          name: Package optimized tarball
          command: |
            mkdir -p release-artifacts
            tar -czf release-artifacts/scryer-linux-x86_64-haswell.tar.gz -C target/ci-linux-x86_64-haswell-release/x86_64-unknown-linux-musl/release scryer
      - persist_release_artifact:
          path: release-artifacts/scryer-linux-x86_64-haswell.tar.gz

  rust-build-linux-arm64-portable:
    executor: linux-arm-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix:
          key_prefix: linux-arm64-portable-release
      - restore_target_cache:
          key_prefix: linux-arm64-portable-release
      - setup_rust_unix:
          target: aarch64-unknown-linux-musl
      - setup_sccache_unix:
          asset_name: sccache-v0.15.0-aarch64-unknown-linux-musl.tar.gz
          sha256: 3a6a3712b49da3d263bf2d30d702de4302793016019e800bfb81c0c69401d8f8
      - run:
          name: Install system dependencies
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold musl-tools nasm
      - run:
          name: Build portable release binary (Linux arm64 + embedded UI)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-arm64-portable-release
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
            RUSTFLAGS: --cfg aes_armv8 --cfg chacha20_force_neon
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            export RUSTC_WRAPPER="$HOME/.cargo/bin/sccache"
            export SCCACHE_DIR="$HOME/.cache/sccache"
            export SCCACHE_CACHE_SIZE="10G"
            export CARGO_INCREMENTAL=0
            sccache --zero-stats || true
            mold -run cargo build -p scryer --release --locked --target aarch64-unknown-linux-musl
            sccache --show-stats || true
      - save_target_cache:
          key_prefix: linux-arm64-portable-release
          path: target/ci-linux-arm64-portable-release
      - save_rust_cache_unix:
          key_prefix: linux-arm64-portable-release
      - run:
          name: Package portable tarballs
          command: |
            mkdir -p release-artifacts
            tar -czf release-artifacts/scryer-linux-arm64-portable.tar.gz -C target/ci-linux-arm64-portable-release/aarch64-unknown-linux-musl/release scryer
            cp release-artifacts/scryer-linux-arm64-portable.tar.gz release-artifacts/scryer-linux-arm64.tar.gz
      - persist_release_artifact:
          path: release-artifacts/scryer-linux-arm64.tar.gz
      - persist_release_artifact:
          path: release-artifacts/scryer-linux-arm64-portable.tar.gz

  rust-build-linux-arm64-cortex-a76:
    executor: linux-arm-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix:
          key_prefix: linux-arm64-cortex-a76-release
      - restore_target_cache:
          key_prefix: linux-arm64-cortex-a76-release
      - setup_rust_unix:
          target: aarch64-unknown-linux-musl
      - setup_sccache_unix:
          asset_name: sccache-v0.15.0-aarch64-unknown-linux-musl.tar.gz
          sha256: 3a6a3712b49da3d263bf2d30d702de4302793016019e800bfb81c0c69401d8f8
      - run:
          name: Install system dependencies
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold musl-tools nasm
      - run:
          name: Build optimized release binary (Linux arm64 cortex-a76 + embedded UI)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-arm64-cortex-a76-release
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
            RUSTFLAGS: -C target-cpu=cortex-a76 --cfg aes_armv8 --cfg chacha20_force_neon
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            export RUSTC_WRAPPER="$HOME/.cargo/bin/sccache"
            export SCCACHE_DIR="$HOME/.cache/sccache"
            export SCCACHE_CACHE_SIZE="10G"
            export CARGO_INCREMENTAL=0
            sccache --zero-stats || true
            mold -run cargo build -p scryer --release --locked --target aarch64-unknown-linux-musl
            sccache --show-stats || true
      - save_target_cache:
          key_prefix: linux-arm64-cortex-a76-release
          path: target/ci-linux-arm64-cortex-a76-release
      - save_rust_cache_unix:
          key_prefix: linux-arm64-cortex-a76-release
      - run:
          name: Package optimized tarball
          command: |
            mkdir -p release-artifacts
            tar -czf release-artifacts/scryer-linux-arm64-cortex-a76.tar.gz -C target/ci-linux-arm64-cortex-a76-release/aarch64-unknown-linux-musl/release scryer
      - persist_release_artifact:
          path: release-artifacts/scryer-linux-arm64-cortex-a76.tar.gz

  rust-build-macos-arm64:
    executor: macos-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix:
          key_prefix: macos-arm64-release
      - restore_target_cache:
          key_prefix: macos-arm64-release
      - setup_rust_unix
      - setup_sccache_unix:
          asset_name: sccache-v0.15.0-aarch64-apple-darwin.tar.gz
          sha256: 430ef7b5f54256d3ed5bfe77e8b0afc51aa209aeebe4f95b69c3a52ce3acc6e9
      - run:
          name: Install system dependencies
          command: brew install nasm
      - run:
          name: Build release binary (macOS arm64)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-macos-arm64-release
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
            RUSTFLAGS: -C target-cpu=apple-m1 --cfg aes_armv8 --cfg chacha20_force_neon
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            cargo build -p scryer --release --locked
      - save_target_cache:
          key_prefix: macos-arm64-release
          path: target/ci-macos-arm64-release
      - show_sccache_stats_unix
      - save_rust_cache_unix:
          key_prefix: macos-arm64-release
      - run:
          name: Codesign binary
          command: |
            KEYCHAIN="build.keychain-db"
            KEYCHAIN_PASS="ci-ephemeral"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security set-keychain-settings -lut 900 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            printf '%s' "$APPLE_SIGNING_CERT_P12" | tr -d '\r\n' | base64 --decode > /tmp/cert.p12
            security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$APPLE_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
            codesign --sign "Scryer Media Signing" --identifier media.scryer.app --force target/ci-macos-arm64-release/release/scryer
            codesign --verify --verbose target/ci-macos-arm64-release/release/scryer
            rm /tmp/cert.p12
            security delete-keychain "$KEYCHAIN"
      - run:
          name: Package tarball
          command: |
            mkdir -p release-artifacts
            tar -czf release-artifacts/scryer-darwin-arm64.tar.gz -C target/ci-macos-arm64-release/release scryer
      - persist_release_artifact:
          path: release-artifacts/scryer-darwin-arm64.tar.gz

  rust-build-windows-x86_64:
    executor: windows-medium
    working_directory: C:\Users\circleci\project
    steps:
      - checkout
      - run:
          name: Configure git for tag fetches
          command: git fetch --force --tags --prune
      - attach_repo_workspace
      - restore_rust_cache_windows
      - restore_target_cache:
          key_prefix: windows-x86_64-release
      - run:
          name: Install Rust 1.95.0
          command: |
            if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
              choco install rustup.install -y
            }
            $Env:Path = "$HOME\.cargo\bin;$Env:Path"
            [Environment]::SetEnvironmentVariable("Path", $Env:Path, "Process")
            rustup set profile minimal
            rustup toolchain install 1.95.0-x86_64-pc-windows-msvc
            rustup target add --toolchain 1.95.0-x86_64-pc-windows-msvc x86_64-pc-windows-msvc
            rustup default 1.95.0-x86_64-pc-windows-msvc
            rustup show active-toolchain
            cargo --version
            rustc --version
      - run:
          name: Install NASM
          command: |
            $url = "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip"
            $expectedSha256 = "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4"
            Invoke-WebRequest $url -OutFile nasm.zip
            $actualSha256 = (Get-FileHash nasm.zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) {
              throw "NASM checksum mismatch: expected $expectedSha256, got $actualSha256"
            }
            Expand-Archive nasm.zip -DestinationPath C:\nasm
            $dir = (Get-ChildItem C:\nasm -Directory | Select-Object -First 1).FullName
            $Env:Path = "$dir;$Env:Path"
            [Environment]::SetEnvironmentVariable("Path", $Env:Path, "Process")
      - run:
          name: Build release binary (Windows x86_64)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: C:\Users\circleci\project\target\ci-windows-x86_64-release
            SCRYER_EMBED_UI_DIR: C:\Users\circleci\project\apps\scryer-web\dist
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
            RUSTFLAGS: -C target-cpu=haswell -C linker=link.exe -C linker-flavor=msvc
          command: |
            $vswhere = Join-Path ${Env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vsPath) {
              throw "Unable to locate a Visual Studio installation with MSVC build tools"
            }
            $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
            cmd.exe /s /c "`"$vsDevCmd`" -arch=x64 -host_arch=x64 && set" |
              ForEach-Object {
                if ($_ -match '^(.*?)=(.*)$') {
                  [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2], "Process")
                }
              }
            $Env:CARGO_BUILD_TARGET = "x86_64-pc-windows-msvc"
            $Env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = "link.exe"
            Remove-Item Env:CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER -ErrorAction SilentlyContinue
            where.exe link
            rustup run 1.95.0-x86_64-pc-windows-msvc rustc -vV
            rustup run 1.95.0-x86_64-pc-windows-msvc cargo build -p scryer --release --locked --target x86_64-pc-windows-msvc
      - save_target_cache:
          key_prefix: windows-x86_64-release
          path: C:\Users\circleci\project\target\ci-windows-x86_64-release
      - save_rust_cache_windows
      - run:
          name: Create README.txt
          command: |
            @"
            scryer for Windows
            ==================

            Quick Start
            -----------
            1. Double-click scryer.exe (or run it from a terminal).
            2. Open http://localhost:8080 in your browser.

            Data is stored in %LOCALAPPDATA%\scryer by default. To use a
            different location, pass --data-dir:

                scryer.exe --data-dir C:\scryer-data

            Encryption Key
            --------------
            Scryer encrypts passwords and API keys stored in its database.
            On first run an encryption key is auto-generated and stored
            securely by Windows. No manual key management is needed.

            To override the key (advanced), set the environment variable
            SCRYER_ENCRYPTION_KEY before starting scryer.

            Running as a Windows Service (NSSM)
            ------------------------------------
            NSSM (https://nssm.cc) lets you run scryer as a background
            service that starts automatically with Windows.

            1. Download nssm and extract it somewhere on your PATH.
            2. Open an elevated (Administrator) terminal and run:

                nssm install scryer "C:\path\to\scryer.exe"
                nssm set scryer AppDirectory "C:\path\to"
                nssm set scryer AppParameters "--data-dir C:\scryer-data"
                nssm set scryer Start SERVICE_AUTO_START
                nssm start scryer

            To remove the service later:

                nssm stop scryer
                nssm remove scryer confirm

            Environment Variables
            ---------------------
            SCRYER_MOVIES_PATH      Movies directory
            SCRYER_SERIES_PATH      Series directory
            SCRYER_BIND             Listen address (default: 127.0.0.1:8080)
            SCRYER_OPEN_BROWSER     Set to "false" to disable auto-open
            SCRYER_DB_PATH          Override database path (advanced)
            "@ | Set-Content -Path README.txt -Encoding UTF8
      - run:
          name: Package zip
          command: |
            New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
            Compress-Archive -Path target\ci-windows-x86_64-release\release\scryer.exe,README.txt -DestinationPath release-artifacts\scryer-windows-x86_64.zip
      - persist_to_workspace:
          root: .
          paths:
            - release-artifacts/scryer-windows-x86_64.zip
      - store_artifacts:
          path: release-artifacts/scryer-windows-x86_64.zip

  docker-validate-amd64:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - run:
          name: Configure docker buildx
          command: |
            docker buildx rm scryer-circleci-validate-amd64 >/dev/null 2>&1 || true
            docker buildx create --use --name scryer-circleci-validate-amd64
      - run:
          name: Validate Docker runtime selector
          command: sh docker/test_runtime_select.sh
      - run:
          name: Validate Docker docs contract
          command: sh docker/test_docs_contract.sh
      - run:
          name: Prepare build context
          command: sh docker/prepare-build-context.sh release-artifacts docker-ctx
      - run:
          name: Build base validation image
          command: |
            docker buildx build \
              --platform linux/amd64 \
              --tag scryer:test-amd64 \
              --file docker/scryer.Dockerfile \
              --load \
              docker-ctx
      - run:
          name: Smoke test base image runtime
          command: sh docker/test_image_runtime.sh scryer:test-amd64 linux/amd64
      - run:
          name: Build slim validation image
          command: |
            docker buildx build \
              --platform linux/amd64 \
              --tag scryer:test-amd64-slim \
              --file docker/scryer.Dockerfile \
              --load \
              docker-ctx
      - run:
          name: Smoke test slim image runtime
          command: sh docker/test_image_runtime.sh scryer:test-amd64-slim linux/amd64
      - run:
          name: Build modern validation image
          command: |
            docker buildx build \
              --build-arg SCRYER_RUNTIME_MODE=modern \
              --platform linux/amd64 \
              --tag scryer:test-amd64-modern \
              --file docker/scryer.Dockerfile \
              --load \
              docker-ctx
      - run:
          name: Smoke test modern image runtime
          command: sh docker/test_modern_image_runtime.sh scryer:test-amd64-modern linux/amd64 amd64

