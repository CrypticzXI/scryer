version: 2.1

# Required contexts:
# - scryer-build:
#   - SCRYER_SMG_REGISTRATION_SECRET
#   - APPLE_SIGNING_CERT_P12
#   - APPLE_SIGNING_CERT_PASSWORD
# - scryer-release:
#   - GITHUB_TOKEN
#   - GHCR_TOKEN
#   - optional GHCR_USERNAME (defaults to CIRCLE_PROJECT_USERNAME)
#   - TAP_TOKEN
#   - WEB_TOKEN
#   - SCRYER_CIRCLECI_ENABLE_DOCKER_PUBLISH=true to allow docker pushes
#   - SCRYER_CIRCLECI_ENABLE_RELEASE_PUBLISH=true to allow GitHub releases
#   - SCRYER_CIRCLECI_ENABLE_HOMEBREW_UPDATE=true to allow tap updates
#   - SCRYER_CIRCLECI_ENABLE_SITE_REBUILD=true to allow site rebuild triggers

executors:
  linux-medium:
    machine:
      image: ubuntu-2404:current
    resource_class: large
  linux-arm-medium:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
  macos-medium:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
  windows-medium:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium

commands:
  fetch_full_history:
    steps:
      - run:
          name: Fetch tags and full history
          command: |
            git fetch --force --tags --prune
            git fetch --unshallow || true

  setup_node_25:
    steps:
      - run:
          name: Install Node.js 25
          command: |
            export NVM_DIR="$HOME/.nvm"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            fi
            {
              echo 'export NVM_DIR="$HOME/.nvm"'
              echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"'
              echo 'nvm install 25'
              echo 'nvm alias default 25'
              echo 'nvm use 25 >/dev/null'
            } >> "$BASH_ENV"
            . "$BASH_ENV"
            node --version
            npm --version

  setup_rust_unix:
    parameters:
      toolchain:
        type: string
        default: "1.95.0"
      component:
        type: string
        default: ""
      target:
        type: string
        default: ""
    steps:
      - run:
          name: Install Rust << parameters.toolchain >>
          command: |
            if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
            fi
            {
              echo '. "$HOME/.cargo/env"'
            } >> "$BASH_ENV"
            . "$BASH_ENV"
            rustup set profile minimal
            rustup toolchain install "<< parameters.toolchain >>"
            rustup default "<< parameters.toolchain >>"
            if [ -n "<< parameters.component >>" ]; then
              rustup component add "<< parameters.component >>"
            fi
            if [ -n "<< parameters.target >>" ]; then
              rustup target add "<< parameters.target >>"
            fi
            cargo --version
            rustc --version

  restore_rust_cache_unix:
    steps:
      - restore_cache:
          keys:
            - v1-rust-unix-{{ arch }}-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
            - v1-rust-unix-{{ arch }}-{{ checksum "rust-toolchain.toml" }}
            - v1-rust-unix-{{ arch }}

  save_rust_cache_unix:
    steps:
      - save_cache:
          key: v1-rust-unix-{{ arch }}-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/bin
            - ~/.cargo/git
            - ~/.cargo/registry
            - ~/.rustup

  restore_rust_cache_windows:
    steps:
      - restore_cache:
          keys:
            - v1-rust-windows-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
            - v1-rust-windows-{{ checksum "rust-toolchain.toml" }}
            - v1-rust-windows

  save_rust_cache_windows:
    steps:
      - save_cache:
          key: v1-rust-windows-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
          paths:
            - C:\Users\circleci\.cargo\bin
            - C:\Users\circleci\.cargo\git
            - C:\Users\circleci\.cargo\registry
            - C:\Users\circleci\.rustup

  restore_target_cache:
    parameters:
      key_prefix:
        type: string
    steps:
      - restore_cache:
          keys:
            - v1-target-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
            - v1-target-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}
            - v1-target-<< parameters.key_prefix >>

  save_target_cache:
    parameters:
      key_prefix:
        type: string
      path:
        type: string
    steps:
      - save_cache:
          key: v1-target-<< parameters.key_prefix >>-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
          paths:
            - << parameters.path >>

  attach_repo_workspace:
    steps:
      - attach_workspace:
          at: .

  persist_release_artifact:
    parameters:
      path:
        type: string
    steps:
      - persist_to_workspace:
          root: .
          paths:
            - << parameters.path >>
      - store_artifacts:
          path: << parameters.path >>

jobs:
  web:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - setup_node_25
      - run:
          name: Install dependencies
          command: |
            . "$BASH_ENV"
            cd apps/scryer-web
            npm ci
      - run:
          name: Lint
          command: |
            . "$BASH_ENV"
            cd apps/scryer-web
            npm run lint
      - run:
          name: Build web app
          environment:
            SCRYER_GRAPHQL_URL: /graphql
            SCRYER_METADATA_GATEWAY_GRAPHQL_URL: https://smg.scryer.media/graphql
          command: |
            . "$BASH_ENV"
            cd apps/scryer-web
            npm run build
      - run:
          name: Verify static output
          command: test -f apps/scryer-web/dist/index.html
      - persist_to_workspace:
          root: .
          paths:
            - apps/scryer-web/dist
      - store_artifacts:
          path: apps/scryer-web/dist

  rust-check:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix
      - restore_target_cache:
          key_prefix: linux-check
      - setup_rust_unix:
          component: clippy
      - run:
          name: Install system dependencies
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm
      - run:
          name: Install cargo-nextest
          command: |
            . "$BASH_ENV"
            if ! command -v cargo-nextest >/dev/null 2>&1; then
              cargo install cargo-nextest --locked
            fi
      - run:
          name: Run clippy for production binary packages
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-check
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            cargo clippy --locked \
              -p scryer \
              -p scryer-application \
              -p scryer-domain \
              -p scryer-infrastructure \
              -p scryer-interface \
              -p scryer-mediainfo \
              -p scryer-plugins \
              -p scryer-release-parser \
              -p scryer-rules \
              -- -D warnings
      - run:
          name: Run production binary package tests
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-check
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
            RUST_MIN_STACK: "4194304"
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            cargo nextest run --locked \
              -p scryer \
              -p scryer-application \
              -p scryer-domain \
              -p scryer-infrastructure \
              -p scryer-interface \
              -p scryer-mediainfo \
              -p scryer-plugins \
              -p scryer-release-parser \
              -p scryer-rules
      - save_target_cache:
          key_prefix: linux-check
          path: target/ci-linux-check
      - save_rust_cache_unix

  rust-build-linux-x86_64:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix
      - restore_target_cache:
          key_prefix: linux-x86_64-release
      - setup_rust_unix
      - run:
          name: Install system dependencies
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold nasm
      - run:
          name: Build release binary (Linux x86_64 + embedded UI)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-x86_64-release
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            mold -run cargo build -p scryer --release --locked
      - save_target_cache:
          key_prefix: linux-x86_64-release
          path: target/ci-linux-x86_64-release
      - save_rust_cache_unix
      - run:
          name: Package tarball
          command: |
            mkdir -p release-artifacts
            tar -czf release-artifacts/scryer-linux-x86_64.tar.gz -C target/ci-linux-x86_64-release/release scryer
      - persist_release_artifact:
          path: release-artifacts/scryer-linux-x86_64.tar.gz

  rust-build-linux-arm64:
    executor: linux-arm-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix
      - restore_target_cache:
          key_prefix: linux-arm64-release
      - setup_rust_unix
      - run:
          name: Install system dependencies
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold nasm
      - run:
          name: Build release binary (Linux arm64 + embedded UI)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-linux-arm64-release
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            mold -run cargo build -p scryer --release --locked
      - save_target_cache:
          key_prefix: linux-arm64-release
          path: target/ci-linux-arm64-release
      - save_rust_cache_unix
      - run:
          name: Package tarball
          command: |
            mkdir -p release-artifacts
            tar -czf release-artifacts/scryer-linux-arm64.tar.gz -C target/ci-linux-arm64-release/release scryer
      - persist_release_artifact:
          path: release-artifacts/scryer-linux-arm64.tar.gz

  rust-build-macos-arm64:
    executor: macos-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - restore_rust_cache_unix
      - restore_target_cache:
          key_prefix: macos-arm64-release
      - setup_rust_unix
      - run:
          name: Install system dependencies
          command: brew install nasm
      - run:
          name: Build release binary (macOS arm64)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: target/ci-macos-arm64-release
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
            RUSTFLAGS: -C target-cpu=apple-m1 --cfg aes_armv8 --cfg chacha20_force_neon
          command: |
            . "$BASH_ENV"
            export SCRYER_EMBED_UI_DIR="$PWD/apps/scryer-web/dist"
            cargo build -p scryer --release --locked
      - save_target_cache:
          key_prefix: macos-arm64-release
          path: target/ci-macos-arm64-release
      - save_rust_cache_unix
      - run:
          name: Codesign binary
          command: |
            KEYCHAIN="build.keychain-db"
            KEYCHAIN_PASS="ci-ephemeral"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security set-keychain-settings -lut 900 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            echo -n "$APPLE_SIGNING_CERT_P12" | base64 --decode > /tmp/cert.p12
            security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$APPLE_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
            codesign --sign "Scryer Media Signing" --identifier media.scryer.app --force target/ci-macos-arm64-release/release/scryer
            codesign --verify --verbose target/ci-macos-arm64-release/release/scryer
            rm /tmp/cert.p12
            security delete-keychain "$KEYCHAIN"
      - run:
          name: Package tarball
          command: |
            mkdir -p release-artifacts
            tar -czf release-artifacts/scryer-darwin-arm64.tar.gz -C target/ci-macos-arm64-release/release scryer
      - persist_release_artifact:
          path: release-artifacts/scryer-darwin-arm64.tar.gz

  rust-build-windows-x86_64:
    executor: windows-medium
    working_directory: C:\Users\circleci\project
    steps:
      - checkout
      - run:
          name: Configure git for tag fetches
          command: git fetch --force --tags --prune
      - attach_repo_workspace
      - restore_rust_cache_windows
      - restore_target_cache:
          key_prefix: windows-x86_64-release
      - run:
          name: Install Rust 1.95.0
          command: |
            if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
              choco install rustup.install -y
            }
            $Env:Path = "$HOME\.cargo\bin;$Env:Path"
            [Environment]::SetEnvironmentVariable("Path", $Env:Path, "Process")
            rustup set profile minimal
            rustup toolchain install 1.95.0
            rustup default 1.95.0
            cargo --version
            rustc --version
      - run:
          name: Install NASM
          command: |
            $url = "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip"
            $expectedSha256 = "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4"
            Invoke-WebRequest $url -OutFile nasm.zip
            $actualSha256 = (Get-FileHash nasm.zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) {
              throw "NASM checksum mismatch: expected $expectedSha256, got $actualSha256"
            }
            Expand-Archive nasm.zip -DestinationPath C:\nasm
            $dir = (Get-ChildItem C:\nasm -Directory | Select-Object -First 1).FullName
            $Env:Path = "$dir;$Env:Path"
            [Environment]::SetEnvironmentVariable("Path", $Env:Path, "Process")
      - run:
          name: Build release binary (Windows x86_64)
          no_output_timeout: 30m
          environment:
            CARGO_TARGET_DIR: C:\Users\circleci\project\target\ci-windows-x86_64-release
            SCRYER_EMBED_UI_DIR: C:\Users\circleci\project\apps\scryer-web\dist
            SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
            RUSTFLAGS: -C target-cpu=haswell -C linker=rust-lld
          command: rustup run 1.95.0 cargo build -p scryer --release --locked
      - save_target_cache:
          key_prefix: windows-x86_64-release
          path: C:\Users\circleci\project\target\ci-windows-x86_64-release
      - save_rust_cache_windows
      - run:
          name: Create README.txt
          command: |
            @"
            scryer for Windows
            ==================

            Quick Start
            -----------
            1. Double-click scryer.exe (or run it from a terminal).
            2. Open http://localhost:8080 in your browser.

            Data is stored in %LOCALAPPDATA%\scryer by default. To use a
            different location, pass --data-dir:

                scryer.exe --data-dir C:\scryer-data

            Encryption Key
            --------------
            Scryer encrypts passwords and API keys stored in its database.
            On first run an encryption key is auto-generated and stored
            securely by Windows. No manual key management is needed.

            To override the key (advanced), set the environment variable
            SCRYER_ENCRYPTION_KEY before starting scryer.

            Running as a Windows Service (NSSM)
            ------------------------------------
            NSSM (https://nssm.cc) lets you run scryer as a background
            service that starts automatically with Windows.

            1. Download nssm and extract it somewhere on your PATH.
            2. Open an elevated (Administrator) terminal and run:

                nssm install scryer "C:\path\to\scryer.exe"
                nssm set scryer AppDirectory "C:\path\to"
                nssm set scryer AppParameters "--data-dir C:\scryer-data"
                nssm set scryer Start SERVICE_AUTO_START
                nssm start scryer

            To remove the service later:

                nssm stop scryer
                nssm remove scryer confirm

            Environment Variables
            ---------------------
            SCRYER_MOVIES_PATH      Movies directory
            SCRYER_SERIES_PATH      Series directory
            SCRYER_BIND             Listen address (default: 127.0.0.1:8080)
            SCRYER_OPEN_BROWSER     Set to "false" to disable auto-open
            SCRYER_DB_PATH          Override database path (advanced)
            "@ | Set-Content -Path README.txt -Encoding UTF8
      - run:
          name: Package zip
          command: |
            New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
            Compress-Archive -Path target\ci-windows-x86_64-release\release\scryer.exe,README.txt -DestinationPath release-artifacts\scryer-windows-x86_64.zip
      - persist_to_workspace:
          root: .
          paths:
            - release-artifacts/scryer-windows-x86_64.zip
      - store_artifacts:
          path: release-artifacts/scryer-windows-x86_64.zip

  docker-publish:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - run:
          name: Prepare build context
          command: |
            mkdir -p docker-ctx/amd64 docker-ctx/arm64
            tar -xzf release-artifacts/scryer-linux-x86_64.tar.gz -C docker-ctx/amd64
            tar -xzf release-artifacts/scryer-linux-arm64.tar.gz -C docker-ctx/arm64
            cp docker/entrypoint.sh docker-ctx/entrypoint.sh
      - run:
          name: Compute docker tags
          command: |
            TAG_VERSION="${CIRCLE_TAG#scryer-v}"
            SHORT_SHA="$(printf '%s' "$CIRCLE_SHA1" | cut -c1-7)"
            {
              echo "export SCRYER_DOCKER_TAG_VERSION=$TAG_VERSION"
              echo "export SCRYER_DOCKER_TAG_SHA=sha-$SHORT_SHA"
            } >> "$BASH_ENV"
      - run:
          name: Verify docker build without push
          command: |
            . "$BASH_ENV"
            if [ "${SCRYER_CIRCLECI_ENABLE_DOCKER_PUBLISH:-false}" = "true" ]; then
              echo "Docker publish enabled; skipping dry-run smoke build."
              exit 0
            fi
            docker buildx create --use --name scryer-circleci-builder
            docker buildx build \
              --platform linux/amd64 \
              --tag scryer-circleci-verify:${SCRYER_DOCKER_TAG_SHA} \
              --file docker/scryer.Dockerfile \
              --load \
              docker-ctx
      - run:
          name: Build and push docker image
          command: |
            . "$BASH_ENV"
            if [ "${SCRYER_CIRCLECI_ENABLE_DOCKER_PUBLISH:-false}" != "true" ]; then
              echo "SCRYER_CIRCLECI_ENABLE_DOCKER_PUBLISH is not true; skipping docker push."
              exit 0
            fi
            USERNAME="${GHCR_USERNAME:-$CIRCLE_PROJECT_USERNAME}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$USERNAME" --password-stdin
            docker buildx create --use --name scryer-circleci-publisher
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag ghcr.io/${CIRCLE_PROJECT_USERNAME}/scryer:latest \
              --tag ghcr.io/${CIRCLE_PROJECT_USERNAME}/scryer:${SCRYER_DOCKER_TAG_SHA} \
              --tag ghcr.io/${CIRCLE_PROJECT_USERNAME}/scryer:${SCRYER_DOCKER_TAG_VERSION} \
              --file docker/scryer.Dockerfile \
              --push \
              docker-ctx

  publish-release:
    executor: linux-medium
    working_directory: ~/project
    steps:
      - checkout
      - fetch_full_history
      - attach_repo_workspace
      - run:
          name: Prepare release artifacts
          command: |
            mkdir -p release-output
            cp release-artifacts/scryer-*.tar.gz release-output/
            cp release-artifacts/scryer-*.zip release-output/
            (cd release-output && shasum -a 256 scryer-*.tar.gz scryer-*.zip > scryer-checksums.txt)
      - store_artifacts:
          path: release-output
      - run:
          name: Publish GitHub release
          command: |
            if [ "${SCRYER_CIRCLECI_ENABLE_RELEASE_PUBLISH:-false}" != "true" ]; then
              echo "SCRYER_CIRCLECI_ENABLE_RELEASE_PUBLISH is not true; skipping GitHub release publish."
              exit 0
            fi
            if ! command -v gh >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y gh
            fi
            export GH_TOKEN="${GITHUB_TOKEN}"
            if gh release view "$CIRCLE_TAG" >/dev/null 2>&1; then
              gh release upload "$CIRCLE_TAG" release-output/* --clobber
            else
              gh release create "$CIRCLE_TAG" release-output/* --title "$CIRCLE_TAG" --generate-notes --verify-tag
            fi
      - run:
          name: Update Homebrew tap
          command: |
            if [ "${SCRYER_CIRCLECI_ENABLE_HOMEBREW_UPDATE:-false}" != "true" ]; then
              echo "SCRYER_CIRCLECI_ENABLE_HOMEBREW_UPDATE is not true; skipping Homebrew update."
              exit 0
            fi
            if [ -z "${TAP_TOKEN:-}" ]; then
              echo "TAP_TOKEN not set; skipping tap update."
              exit 0
            fi
            VERSION="${CIRCLE_TAG#scryer-v}"
            LINUX_X86_SHA=$(shasum -a 256 release-output/scryer-linux-x86_64.tar.gz | cut -d ' ' -f1)
            LINUX_ARM_SHA=$(shasum -a 256 release-output/scryer-linux-arm64.tar.gz | cut -d ' ' -f1)
            DARWIN_ARM_SHA=$(shasum -a 256 release-output/scryer-darwin-arm64.tar.gz | cut -d ' ' -f1)
            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            mkdir -p tap/Formula
            cat > tap/Formula/scryer.rb \<<FORMULA
            class Scryer < Formula
              desc "Self-hosted media acquisition and management platform"
              homepage "https://github.com/${REPO}"
              version "${VERSION}"
              license "MIT"

              def install_support_files
                (pkgshare/"config.env.example").write \<<~EOS
                  # Homebrew-managed Scryer service overrides.
                  SCRYER_BIND=127.0.0.1:8686
                EOS

                (libexec/"scryer-service").write \<<~SH
                  #!/bin/sh
                  CONFIG_FILE="#{etc}/scryer/config.env"

                  if [ -f "\$CONFIG_FILE" ]; then
                    set -a
                    . "\$CONFIG_FILE"
                    set +a
                  fi

                  exec "#{opt_bin}/scryer" --data-dir "#{var}/scryer" "\$@"
                SH

                chmod 0755, libexec/"scryer-service"
              end

              on_macos do
                on_arm do
                  url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-darwin-arm64.tar.gz"
                  sha256 "${DARWIN_ARM_SHA}"
                end
              end

              on_linux do
                on_arm do
                  url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-linux-arm64.tar.gz"
                  sha256 "${LINUX_ARM_SHA}"
                end

                on_intel do
                  url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-linux-x86_64.tar.gz"
                  sha256 "${LINUX_X86_SHA}"
                end
              end

              def install
                bin.install "scryer"
                install_support_files

                config_dir = etc/"scryer"
                config_dir.mkpath
                (var/"scryer").mkpath
                (var/"log").mkpath
                config_file = config_dir/"config.env"
                unless config_file.exist?
                  config_file.write \<<~EOS
                    SCRYER_BIND=127.0.0.1:8686
                  EOS
                end
              end

              def caveats
                \<<~EOS
                  Edit #{etc}/scryer/config.env to customize the Homebrew-managed service,
                  then restart it with:
                    brew services restart scryer
                EOS
              end

              service do
                run [opt_libexec/"scryer-service"]
                keep_alive true
                log_path var/"log/scryer.log"
                error_log_path var/"log/scryer.log"
              end

              test do
                assert_match "scryer", shell_output("#{bin}/scryer --version")
              end
            end
            FORMULA
            sed -i 's/^            //' tap/Formula/scryer.rb
            git clone "https://${TAP_TOKEN}@github.com/scryer-media/homebrew-scryer.git" tap-repo
            mkdir -p tap-repo/Formula
            cp tap/Formula/scryer.rb tap-repo/Formula/scryer.rb
            cd tap-repo
            git config user.name "circleci"
            git config user.email "ci@scryer.media"
            git add Formula/scryer.rb
            if git diff --cached --quiet; then
              echo "Homebrew tap already up to date."
            else
              git commit -m "scryer ${VERSION}"
              git push origin HEAD:main
            fi
      - run:
          name: Trigger marketing site rebuild
          command: |
            if [ "${SCRYER_CIRCLECI_ENABLE_SITE_REBUILD:-false}" != "true" ]; then
              echo "SCRYER_CIRCLECI_ENABLE_SITE_REBUILD is not true; skipping site rebuild."
              exit 0
            fi
            if [ -z "${WEB_TOKEN:-}" ]; then
              echo "WEB_TOKEN not set; skipping site rebuild."
              exit 0
            fi
            git clone "https://${WEB_TOKEN}@github.com/scryer-media/web.git" web-repo
            cd web-repo
            git config user.name "circleci"
            git config user.email "ci@scryer.media"
            git commit --allow-empty -m "rebuild: ${CIRCLE_TAG}"
            git push origin HEAD:main

workflows:
  scryer:
    jobs:
      - web:
          context: scryer-build
          filters: &release_tag_filters
            tags:
              only: /^(scryer-v|cci-scryer-v).*/
            branches:
              ignore: /.*/
      - rust-check:
          context: scryer-build
          requires:
            - web
          filters: *release_tag_filters
      - rust-build-linux-x86_64:
          context: scryer-build
          requires:
            - web
          filters: *release_tag_filters
      - rust-build-linux-arm64:
          context: scryer-build
          requires:
            - web
          filters: *release_tag_filters
      - rust-build-macos-arm64:
          context: scryer-build
          requires:
            - web
          filters: *release_tag_filters
      - rust-build-windows-x86_64:
          context: scryer-build
          requires:
            - web
          filters: *release_tag_filters
      - docker-publish:
          context: scryer-release
          requires:
            - rust-build-linux-x86_64
            - rust-build-linux-arm64
            - rust-check
          filters: *release_tag_filters
      - publish-release:
          context: scryer-release
          requires:
            - rust-build-linux-x86_64
            - rust-build-linux-arm64
            - rust-build-macos-arm64
            - rust-build-windows-x86_64
            - rust-check
          filters: *release_tag_filters
