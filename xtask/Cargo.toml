[package]
name = "xtask"
version = "0.15.5"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dotenvy = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.4.4"
tempfile = "3"
xtask-support = { path = "../xtask-support" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
