[package]
name = "xtask"
version = "0.13.1"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dotenvy = { workspace = true }
quick-xml = { workspace = true, features = ["serialize"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
scryer-plugin-sdk = { path = "../crates/scryer-plugin-sdk" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
scryer-release-parser = { path = "../crates/scryer-release-parser" }
tempfile = "3"
toml = "1"
toml_edit = "0.25"
zstd = "0.13"
