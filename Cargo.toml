[workspace]
members = [
    "xtask",
    "xtask-release",
    "xtask-migrations",
    "xtask-support",
    "crates/scryer-domain",
    "crates/scryer-application",
    "crates/scryer-outbound-http",
    "crates/scryer-release-parser",
    "crates/scryer-infrastructure",
    "crates/scryer-interface-core",
    "crates/scryer-interface-media",
    "crates/scryer-interface-metadata",
    "crates/scryer-interface-settings",
    "crates/scryer-interface",
    "crates/scryer-rules",
    "crates/scryer-plugin-sdk",
    "crates/scryer-plugins",
    "crates/scryer-launcher",
    "crates/scryer",
    "crates/scryer-mock-apis",
    "crates/scryer-mediainfo",
]
exclude = ["test-plugins/test-indexer"]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
dotenvy = "0.15"
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
async-graphql = { version = "7.2", default-features = false, features = ["chrono"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand_core = "0.10"
# SQLite is compiled in via sqlx-sqlite -> libsqlite3-sys bundled mode for single-executable
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "postgres", "json", "chrono", "macros", "migrate"] }
argon2 = "0.5"
aws-lc-rs = { version = "1.16", default-features = false, features = ["non-fips"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
toml = "1"
quick-xml = "0.39.2"
extism = "1.21"
semver = "1"
metrics = "0.24"
security-framework = "3"
security-framework-sys = "2"
keyring-core = "1"
windows-native-keyring-store = "1"
wiremock = "0.6"
strum = { version = "0.28", features = ["derive"] }
governor = "0.10.4"
criterion = "0.5"
fixedbitset = "0.5"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.rc]
inherits = "release"
lto = false
codegen-units = 16
strip = false

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.ravif]
opt-level = 3

[profile.dev.package.rav1e]
opt-level = 3

[profile.dev.package.fast_image_resize]
opt-level = 3
